<!DOCTYPE html>

<!-- ★ lang 을 비워 두지 않는다. (#104)
     보조기술이 어떤 언어로 읽을지 정하는 근거가 이것뿐이다.
     청각장애 학습자를 위한 서비스에서 lang="" 는 취지와 정면으로 어긋난다. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduMeet — 실시간 자막이 있는 온라인 교육</title>
    <meta name="description" content="청각장애 학습자를 위한 온라인 교육 플랫폼. 실시간 음성을 자막으로 바꿉니다.">

    <!-- favicon.ico 에 16·32·48·64·128·256 을 함께 담았다.
         한 크기만 넣으면 고해상도 탭에서 늘어나 뭉개진다. -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#ffffff">

    <!-- 공유 카드. 링크를 붙였을 때 무엇인지 보이게 한다. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EduMeet">
    <meta property="og:title" content="EduMeet — 실시간 자막이 있는 온라인 교육">
    <meta property="og:description" content="청각장애 학습자를 위한 온라인 교육 플랫폼. 실시간 음성을 자막으로 바꿉니다.">
    <meta property="og:url" content="https://studywithtymee.com">
    <meta property="og:image" content="https://studywithtymee.com/og-image.png">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary_large_image">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- 카카오 SDK 제거: Spring Security OAuth2 사용 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
