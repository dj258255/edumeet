# Cloudflare 가 알려주는 "브라우저가 쓴 프로토콜" 을 꺼낸다. (#88)
#
# 프록시 뒤에서 $scheme 은 "CF -> 원본" 구간의 프로토콜이다.
# 브라우저가 http 로 왔는지 https 로 왔는지가 아니다.
# 백엔드가 리다이렉트 URL 이나 쿠키 secure 플래그를 $scheme 으로 정하면 어긋난다.
#
#   CF-Visitor: {"scheme":"https"}
map $http_cf_visitor $cf_visitor_scheme {
    default            $scheme;    # CF 를 안 거친 요청(내부 헬스체크 등)
    ~*"scheme":"https" https;
    ~*"scheme":"http"  http;
}
