# EduMeet 리버스 프록시. (#88)
#
#   /etc/nginx/conf.d/edumeet.conf 로 배치한다.
#
# ── 이름 구성 ──────────────────────────────────────────────────
#   studywithtymee.com        프론트 (Vue 빌드 산출물)
#   www.studywithtymee.com    apex 로 301. 정본을 하나로 정한다
#   api.studywithtymee.com    백엔드 API + WebSocket + Swagger
#
#   monitoring 은 없다. Grafana 는 앞에 인증을 두기 전까지 내걸지 않는다.
#   (#28 "지표를 인터넷에 두지 않는다", #89 에서 127.0.0.1 로 묶었다)
#
# ── 인증서: Cloudflare Origin Certificate ─────────────────────
#   /etc/nginx/ssl/origin.crt , origin.key
#
#   왜 Let's Encrypt 가 아닌가.
#     이 서비스는 Cloudflare 프록시 뒤에 있다. 브라우저가 검증하는 것은
#     CF 의 인증서고, 원본 인증서는 CF 만 본다.
#     Origin Certificate 는 CF 가 자기 CA 로 발급하며 15년짜리라 갱신 크론이 없다.
#
#   그리고 Let's Encrypt 는 여기서 쓰기 까다롭다. 암호화 모드가 "전체" 면
#   CF 가 원본에 443 으로 붙으므로, 원본에 인증서가 없으면 HTTP-01 검증
#   요청조차 도달하지 못한다 - 실제로 521 을 받았다. 닭-달걀이다.
#
# ── 왜 TLS 가 구색이 아닌가 ────────────────────────────────────
#   프론트가 https 인데 API 가 http 면 브라우저가 mixed content 로 막는다.
#   CORS 이전 단계라 서버 헤더를 아무리 손봐도 소용없다.
#   ws:// 도 https 페이지에서는 wss:// 여야 한다. "채팅이 도느냐" 의 문제다.

upstream edumeet_app {
    server 127.0.0.1:8080;
    keepalive 32;              # 업스트림 커넥션 재사용. 매 요청 TCP 핸드셰이크를 없앤다
}

# ── 80: Cloudflare 가 http 요청을 넘겨줄 때만 온다 ────────────
server {
    listen 80;
    listen [::]:80;
    server_name studywithtymee.com www.studywithtymee.com api.studywithtymee.com;

    # Let's Encrypt 갱신용. Cloudflare 가 http 요청을 원본 80 으로 넘기고
    # 이 경로를 그대로 통과시킨다. 막으면 90일 뒤 갱신이 실패한다.
    location /.well-known/acme-challenge/ { root /var/www/acme; }

    location / { return 301 https://$host$request_uri; }
}

# ── www -> apex. 정본을 하나로 정한다 ─────────────────────────
#    둘 다 살려 두면 같은 내용이 두 주소에 존재해 검색·쿠키·CORS 가 갈린다.
server {
    # nginx 1.25.1 부터 `http2 on;` 이 별도 지시자가 됐지만
    # 이 서버는 1.20.1 이라 listen 줄에 붙이는 옛 문법을 쓴다.
    # 새 문법을 그대로 두면 unknown directive 로 reload 가 거부된다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.studywithtymee.com;

    ssl_certificate     /etc/letsencrypt/live/studywithtymee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studywithtymee.com/privkey.pem;

    return 301 https://studywithtymee.com$request_uri;
}

# ── apex: 프론트 ──────────────────────────────────────────────
server {
    # nginx 1.25.1 부터 `http2 on;` 이 별도 지시자가 됐지만
    # 이 서버는 1.20.1 이라 listen 줄에 붙이는 옛 문법을 쓴다.
    # 새 문법을 그대로 두면 unknown directive 로 reload 가 거부된다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studywithtymee.com;

    ssl_certificate     /etc/letsencrypt/live/studywithtymee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studywithtymee.com/privkey.pem;

    root /var/www/edumeet;
    index index.html;

    # SPA 는 라우팅이 브라우저 안에 있어서 /class/3 같은 주소를 서버는 모른다.
    # 폴백이 없으면 새로고침에서 404 가 난다 -
    # "링크로 들어가면 되는데 F5 하면 깨져요" 로 보고되는 종류다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── api: 백엔드 ───────────────────────────────────────────────
server {
    # nginx 1.25.1 부터 `http2 on;` 이 별도 지시자가 됐지만
    # 이 서버는 1.20.1 이라 listen 줄에 붙이는 옛 문법을 쓴다.
    # 새 문법을 그대로 두면 unknown directive 로 reload 가 거부된다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.studywithtymee.com;

    ssl_certificate     /etc/letsencrypt/live/studywithtymee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studywithtymee.com/privkey.pem;

    # 과제 첨부가 있으므로 기본값 1m 보다 키운다.
    client_max_body_size 50m;

    # ══════════════════════════════════════════════════════════
    #  ★ WebSocket - 여기가 조용히 깨지는 자리다
    # ══════════════════════════════════════════════════════════
    #
    #  nginx 기본값을 그대로 두면 세 가지가 동시에 잘못된다.
    #
    #    proxy_http_version  기본 1.0  -> Upgrade 헤더 미전달, 핸드셰이크가 400
    #    proxy_read_timeout  기본 60s  -> 60초마다 끊긴다. 에러 로그도 안 남는다
    #    proxy_buffering     기본 on   -> 프레임이 버퍼에 고여 지연이 는다
    #
    #  두 번째가 고약하다. 개발 중에는 60초 안에 새로고침하니 안 보이고,
    #  실제 수업이 시작돼야 "가끔 끊겨요" 로 보고된다.
    location /ws {
        proxy_pass http://edumeet_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # $connection_upgrade 는 /etc/nginx/conf.d/00-maps.conf 에 이미 있다.
        # 여기서 map 을 다시 선언하면 nginx 가 duplicate parameter 로 기동 자체를
        # 거부한다 - "설정이 틀린" 게 아니라 "서버가 안 뜨는" 문제다.
        proxy_set_header Connection $connection_upgrade;

        # ★ 3600초에서 120초로 줄였다. (#106)
        #
        #   전에는 STOMP 하트비트가 꺼져 있어서(heart-beat 0,0) 조용한 연결이
        #   유휴로 보였다. 그래서 타임아웃을 한 시간으로 늘려 막았는데,
        #   그건 "죽은 연결도 한 시간 잡고 있겠다" 는 뜻이다 -
        #   끊긴 클라이언트의 소켓과 파일 디스크립터가 그만큼 남는다.
        #
        #   이제 서버가 25초마다 하트비트를 보낸다. 120초면 하트비트를
        #   네 번 연속 놓쳐야 끊긴다 - 일시적인 네트워크 흔들림은 견디고
        #   진짜 죽은 연결은 2분 안에 걷어낸다.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 실시간에서는 처리량보다 지연이 중요하다.
        proxy_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ★ $scheme 이 아니다. Cloudflare 뒤에서는 $scheme 이 "CF -> 원본"
        #   구간의 프로토콜이라 항상 https 다. 브라우저가 무엇으로 왔는지는
        #   CF-Visitor 헤더에만 있다. (02-cloudflare-visitor.conf)
        proxy_set_header X-Forwarded-Proto $cf_visitor_scheme;
    }

    location / {
        proxy_pass http://edumeet_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";     # keepalive 를 쓰려면 비워야 한다

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cf_visitor_scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    # 관리 엔드포인트는 서비스 포트로 내보내지 않는다. (#28)
    location /actuator { return 404; }
}
