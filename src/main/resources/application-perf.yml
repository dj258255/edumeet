# 부하 측정 전용 프로파일. 시크릿이 없다. 저장소에 커밋된다.
#
#   docker compose -f docker-compose.perf.yml up -d
#   ./gradlew bootRun --args='--spring.profiles.active=perf'
#
# PERF_BATCH_SIZE 로 Hibernate 배치 페치를 켜고 끈다.
# 이 값은 요청 단위로 바꿀 수 없는 전역 설정이라, 개선 전/후 비교는
# 앱을 두 번 띄워서 한다. (scripts/run-benchmark.sh 참조)
#
#   PERF_BATCH_SIZE=-1   배치 페치 없음  → 개선 전
#   PERF_BATCH_SIZE=100  IN 절로 묶음    → 개선 후

# 개발 서버(8080)와 겹치지 않게 별도 포트를 쓴다.
server:
  port: ${PERF_PORT:8081}

spring:
  datasource:
    # PERF_DB_PORT=13307 로 두면 Toxiproxy 를 거쳐 MySQL 로 간다.
    # 잠금 테스트를 결정론적으로 만들기 위해 DB 응답에 지연을 넣을 때 쓴다.
    url: jdbc:mysql://localhost:${PERF_DB_PORT:3307}/edumeet_perf?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: edumeet
    password: perfpass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 커넥션 풀이 병목이 되면 쿼리 개선 효과가 묻힌다.
      # k6 최대 VU(50)보다 넉넉하게 잡아 DB 왕복 자체를 재도록 한다.
      maximum-pool-size: 60
      minimum-idle: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: ${PERF_BATCH_SIZE:-1}
        generate_statistics: true
        # 요청별 SQL 개수를 세기 위해 등록한다.
        # Statistics 는 SessionFactory 누적값이라 동시 요청에서 요청별 델타를 못 낸다.
        session_factory:
          statement_inspector: com.edu.edumeet.perf.QueryCountInspector

  data:
    redis:
      host: localhost
      port: 6380

  mail:
    username: perf@example.com
    password: perf
    host: localhost
    port: 25

  cloud:
    aws:
      credentials:
        access-key: perf-access-key
        secret-key: perf-secret-key
      region:
        static: ap-northeast-2
      s3:
        bucket: perf-bucket

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: perf-client-id
            client-secret: perf-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

edumeet:
  upload:
    path: ${java.io.tmpdir}/edumeet-perf-upload
  # 시드 규모. N+1 은 데이터가 적으면 드러나지 않는다.
  perf:
    seed:
      classes: 5
      assignments-per-class: 30
      students-per-assignment: 20
      submissions-per-assignment: 15
      files-per-submission: 2
      files-per-assignment: 3

front:
  url: http://localhost:3000
  url2: http://localhost:5173

jwt:
  secret: cGVyZi1vbmx5LXNlY3JldC1ub3QtdXNlZC1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4
  expiration_time: 3600000

openvidu:
  # Toxiproxy 를 거쳐 LiveKit 으로 간다. 지연·단절을 주입해
  # 타임아웃과 폴백이 실제로 동작하는지 확인하기 위해서다. (#19)
  #   앱 -> toxiproxy:7881 -[toxic]-> livekit:7880
  url: ${LIVEKIT_URL:http://localhost:7881}
  livekit:
    api:
      # livekit-server --dev 가 쓰는 placeholder 자격증명과 반드시 같아야 한다.
      # 컨테이너 기동 로그: {"API Key": "devkey", "API Secret": "secret"}
      # 값이 다르면 SDK 가 올바른 요청을 보내도 서명 검증에서 401 이 난다.
      key: devkey
      secret: secret

logging:
  level:
    root: WARN
    com.edu.edumeet: WARN
    org.hibernate.SQL: WARN
