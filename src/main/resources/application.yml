# 공통 설정 — 시크릿을 담지 않는다. 이 파일은 저장소에 커밋된다.
# 환경별 시크릿은 application-local.yml (git 무시) 에 둔다.
# 최초 실행: cp application-local.yml.example application-local.yml

spring:
  application:
    name: edumeet
  profiles:
    active: local

  jpa:
    # 영속성 컨텍스트를 뷰 렌더링까지 열어두지 않는다.
    # 커넥션 점유 시간이 길어지고 지연 로딩 위치가 불명확해지는 것을 막는다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 지연 로딩 컬렉션을 IN 절로 묶어서 가져온다.
        # @BatchSize 를 컬렉션마다 붙이는 방식은 새 컬렉션이 추가될 때 누락되기 쉽다.
        # 실제로 이 프로젝트에 @BatchSize 가 없는 @OneToMany 가 8곳 있었다.
        # 전역 기본값을 두고, 특별히 다른 크기가 필요한 곳만 @BatchSize 로 재정의한다.
        default_batch_fetch_size: 100
        # 통계 수집. 성능 측정 시 쿼리 수를 세기 위해 필요하다. (CONTRIBUTING.md 참조)
        generate_statistics: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.edu.edumeet: INFO
