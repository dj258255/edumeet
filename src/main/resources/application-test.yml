# 테스트 프로파일 — 시크릿이 없다. 저장소에 커밋된다.
# clone 직후 ./gradlew test 가 추가 설정 없이 통과해야 한다.

spring:
  # H2 + ddl-auto=create-drop 을 쓴다. MySQL 문법 마이그레이션은 여기서 돌면 안 된다. (#29)
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:edumeet;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        generate_statistics: true   # 테스트에서 쿼리 수를 단언하기 위해 켠다

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    username: test@example.com
    password: test
    host: localhost
    port: 25

  cloud:
    aws:
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      region:
        static: ap-northeast-2
      s3:
        bucket: test-bucket

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

edumeet:
  upload:
    path: ${java.io.tmpdir}/edumeet-test-upload

front:
  url: http://localhost:3000
  url2: http://localhost:5173

jwt:
  # 테스트 전용 더미 값. 실제 시크릿이 아니다.
  secret: dGVzdC1vbmx5LXNlY3JldC1ub3QtdXNlZC1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=
  expiration_time: 3600000

openvidu:
  url: http://localhost:7880
  livekit:
    api:
      key: devkey
      secret: devsecret

logging:
  level:
    com.edu.edumeet: WARN
    org.hibernate.SQL: DEBUG
