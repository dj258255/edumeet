# 데이터소스를 UI 로 등록하면 컨테이너를 다시 만들 때마다 사라진다. 파일로 고정한다. (#28)
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # 로그. (#166)
  #
  # ★ 지표와 로그를 한 화면에서 보려면 데이터소스가 둘 다 있어야 한다.
  #   "큐가 찬 시각" 은 Prometheus 가, "그때 무엇을 버렸나" 는 Loki 가 답한다.
  #   따로 보면 시각을 손으로 맞춰야 하고, 급할 때 그걸 하게 되지 않는다.
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # 로그 한 줄에서 요청 아이디를 뽑아 같은 요청의 다른 줄로 건너뛴다.
      # 이게 없으면 requestId 를 눈으로 복사해 질의창에 붙여야 한다.
      derivedFields:
        - name: requestId
          matcherRegex: '"requestId":"([^"]+)"'
          url: '$${__value.raw}'
          datasourceUid: loki
          urlDisplayLabel: '같은 요청의 다른 줄'
