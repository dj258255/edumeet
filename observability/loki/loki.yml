# 로그 저장소. (#166)
#
# ★ 단일 노드 구성이다. 마이크로서비스 모드가 아니다.
#   2 OCPU 서버에 읽기·쓰기·백엔드를 나눠 띄울 이유가 없다.
#
# ★ 보존 기간을 반드시 건다.
#   이 서버는 디스크가 46GB 이고 이미 80% 가 차 있다.
#   무제한으로 두면 로그가 조용히 디스크를 먹고, 그러면 MySQL 이 먼저 죽는다.
#   경보 회귀 분석에는 Prometheus 와 같은 15일이면 충분하고,
#   로그는 지표보다 부피가 크므로 그보다 짧게 잡는다.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # 기본 로그 레벨이 info 면 Loki 자신의 로그가 시끄럽다.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 7일. 지표(15일)보다 짧게 잡은 이유는 부피다.
  retention_period: 168h
  # 한 스트림이 폭주해 전체를 밀어내지 않게 막는다.
  # 자막 드롭 경보가 울릴 때가 로그도 가장 많이 나오는 때다.
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 10MB
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  # 과거 로그를 밀어 넣는 것을 막는다. 시계가 틀린 컨테이너가 있으면
  # 조회 구간이 통째로 어긋난다.
  #
  # ★ 보존 기간과 같은 값이어야 한다. 실제로 겪었다.
  #   처음에 24h 로 뒀더니 조용한 컨테이너(mysql, redis)의 로그가 통째로 거절됐다.
  #   마지막으로 뭔가를 찍은 게 며칠 전이라, 수집기가 처음 붙어 밀어 넣을 때
  #   전부 "timestamp too old" 로 400 을 받았다.
  #
  #   증상이 고약하다 - 앱 로그는 잘 들어와서 "되고 있다" 로 보이는데,
  #   조용한 컨테이너만 없다. 그리고 그 컨테이너가 조용한 이유를 알고 싶을 때
  #   바로 그 로그가 없다.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # 라벨이 많으면 스트림이 쪼개져 인덱스가 커진다.
  # 라벨은 "무엇으로 거를 것인가" 만 두고 나머지는 JSON 필드로 푼다.
  max_label_names_per_series: 12
  # Loki 3.x 는 service_name 라벨을 알아서 만든다. 여기서는 container 와 같은 값이라
  # 스트림만 쪼갠다. 빈 목록을 주면 안 만든다.
  discover_service_name: []

compactor:
  working_directory: /loki/compactor
  # 보존 기간을 실제로 적용하는 것은 compactor 다.
  # retention_period 만 적고 이걸 안 켜면 삭제가 안 된다.
  retention_enabled: true
  delete_request_store: filesystem

# 규칙 디렉터리. 지금은 비어 있다.
# 로그 기반 경보는 지표로 셀 수 있는 것을 로그로 세지 않는다는 원칙 때문에
# 아직 안 넣었다. 넣게 되면 여기에 둔다.
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
