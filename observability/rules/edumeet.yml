# 경보 규칙. (#139)
#
# ★ 임계값마다 근거를 적는다.
#
#   대부분의 경보는 "CPU > 80%" 처럼 근거 없는 숫자를 쓴다. 그러면 두 가지가 생긴다 -
#   울려도 무엇을 해야 할지 모르고, 안 울려도 안전한지 알 수 없다.
#
#   이 저장소는 붕괴 지점을 이미 쟀다. 그 측정을 임계값의 근거로 쓴다.
#   근거를 못 대는 규칙은 여기 넣지 않는다.
#
# ★ 절대값이 아니라 비율로 묻는다.
#
#   큐 상한을 코드에서 바꿨는데 경보가 옛 절대값을 물어보면 경보는 조용히 무의미해진다.
#   그래서 앱이 capacity 도 지표로 낸다.

groups:
  - name: edumeet-chat
    interval: 15s
    rules:
      # ────────────────────────────────────────────────────────────────
      # 근거: performance/07-chat-unbounded-queue-oom.md
      #
      #   느린 소비자(Toxiproxy 5KB/s)에서 큐가 1,077,906 까지 쌓여 84초에 OOM.
      #   같은 부하·같은 힙에서 빠른 소비자는 큐 최대 525 였다.
      #   상한 2만을 걸어 84초 OOM -> 444초 무중단이 됐다.
      #
      #   즉 상한이 있으니 이제 OOM 으로는 안 죽는다. 대신 CallerRunsPolicy 로
      #   역압이 위로 가서 "발행하는 쪽이 느려진다". 그것을 보려면 큐 점유율을 본다.
      #
      #   50% 를 고른 이유 - 빠른 소비자 정상 상태의 최대가 525(상한의 2.6%)였다.
      #   50% 는 정상 변동의 20배 위라 오탐이 아니다.
      #
      # ★ 다만 "사람이 볼 시간이 남는다" 는 틀렸다. 재 봤다. (#143)
      #
      #   무한 큐 실험의 순증이 초당 12,832건이었다(1,077,906 / 84초).
      #   상한 20,000 기준으로 환산하면
      #
      #       50% -> 100%   0.78초
      #       0   -> 100%   1.56초
      #
      #   scrape_interval 이 15초이고 for 가 1분이다.
      #   그 부하에서는 경보가 평가되기도 전에 큐가 찬다.
      #
      #   이 경보가 유효한 창은 좁다 - 15초의 여유를 주려면 순증이 667건/s 이하여야
      #   하는데, 그 부하의 총 전달 요구가 초당 36,000건이므로
      #   소비가 98.15% 이상 따라잡고 있을 때만 그렇다.
      #
      #   그래서 이 경보의 역할을 다시 적는다 -
      #   급성 붕괴를 막는 것은 상한과 CallerRunsPolicy 다. 이 경보는 그보다
      #   완만한 열화(소비가 조금씩 밀리는 구간)를 잡고, 급성 구간에서는
      #   "무슨 일이 있었나" 를 사후에 알려 주는 기록으로 쓴다.
      - alert: ChatOutboundQueueGrowing
        expr: |
          chat_channel_queued{channel="out"}
            / chat_channel_capacity{channel="out"} > 0.5
        for: 1m
        labels:
          severity: warning
          runbook: docs/performance/07-chat-unbounded-queue-oom.md
        annotations:
          summary: "채팅 아웃바운드 큐가 상한의 50%를 넘었다 (완만한 열화 감지용)"
          description: >-
            큐 {{ $value | humanizePercentage }} 점유. 정상 상태 최대는 상한의 2.6%(525개)였다.
            상한이 있어 OOM 으로 죽지는 않지만, CallerRunsPolicy 때문에
            브로드캐스트를 시작한 스레드가 전송을 떠안는다 - 채팅은 chat-in- 실행기,
            자막은 Tomcat HTTP 요청 스레드다. 후자면 REST API 전체가 느려진다.
            급성 붕괴(순증 1만/s 이상)에서는 이 경보가 늦다. 그때는 사후 기록으로 읽는다.

      # ────────────────────────────────────────────────────────────────
      # 근거: 같은 문서. 상한에 붙었다는 것은 역압이 이미 발행 경로에 걸렸다는 뜻이다.
      - alert: ChatOutboundQueueAtCapacity
        expr: |
          chat_channel_queued{channel="out"}
            / chat_channel_capacity{channel="out"} > 0.9
        for: 30s
        labels:
          severity: critical
          runbook: docs/performance/07-chat-unbounded-queue-oom.md
        annotations:
          summary: "채팅 아웃바운드 큐가 상한에 붙었다"
          description: >-
            큐 {{ $value | humanizePercentage }} 점유. 이 시점부터 발행하는 스레드가
            직접 전송을 떠안는다(CallerRunsPolicy). 메시지는 안 버려지지만 전체가 느려진다.

      # ────────────────────────────────────────────────────────────────
      # 근거: performance/09-chat-capacity-oci.md
      #
      #   fan-out 워크로드에서 200명 -> 500명에 e2e 지연이 45ms -> 1,313ms 로 29배가 됐다.
      #   그때 연결은 하나도 안 끊겼다. 무너진 것은 지연이다.
      #   "몇 명이 붙나" 가 아니라 "몇 명까지 채팅답나" 가 상한이다.
      #
      #   fan-out 대상 수를 보는 이유 - 발행 1건이 구독자 수만큼 작업을 만든다.
      #   증폭기가 커지는 것이 지연보다 먼저 보인다.
      - alert: ChatFanoutAmplificationHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(chat_fanout_recipients_bucket[5m]))) > 200
        for: 5m
        labels:
          severity: warning
          runbook: docs/performance/09-chat-capacity-oci.md
        annotations:
          summary: "발행 1건당 전달 대상이 200을 넘었다 (p95)"
          description: >-
            p95 {{ $value | printf "%.0f" }}명. 200명에서 e2e p95 가 45ms 였고
            500명에서 1,313ms(29배)가 됐다. 이 값이 계속 오르면 지연이 먼저 무너진다.

  - name: edumeet-caption-broadcast
    interval: 15s
    rules:
      # ────────────────────────────────────────────────────────────────
      # 근거: performance/07 · #151
      #
      #   자막 발행은 채팅과 정책이 다르다. 채팅은 이어지는 대화라 안 버리고 느려지지만
      #   (CallerRunsPolicy), 자막은 최신성이 중요해서 밀리면 오래된 것부터 버린다.
      #   5초 밀린 자막은 화면의 음성과 안 맞아 없는 것보다 나쁘기 때문이다.
      #
      #   그래서 여기서 물어야 하는 것은 "버렸는가" 다. 조용히 버리면
      #   "자막이 원래 띄엄띄엄 나오나 보다" 로 읽히고 아무도 이상하다고 느끼지 않는다.
      #
      #   전사는 저장 큐가 따로 들고 있으므로 이 드롭은 다시보기·요약을 망가뜨리지 않는다.
      #   그래서 저장 드롭(critical)과 달리 warning 이다.
      - alert: CaptionBroadcastDropping
        expr: increase(caption_broadcast_dropped_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          runbook: docs/performance/07-chat-unbounded-queue-oom.md
        annotations:
          summary: "실시간 자막이 화면에 못 나가고 버려지고 있다"
          description: >-
            5분간 {{ $value | printf "%.0f" }}건이 발행 큐에서 버려졌다. 화면에서만 사라지고
            전사에는 남는다. 아웃바운드가 포화했는지, 구독자가 몰렸는지 함께 본다.

      # 근거: 같은 곳. 큐가 차 있다는 것은 화면 자막이 이미 밀리고 있다는 뜻이다.
      - alert: CaptionBroadcastQueueBacklogged
        expr: |
          caption_broadcast_queued / caption_broadcast_capacity > 0.5
        for: 1m
        labels:
          severity: warning
          runbook: docs/performance/07-chat-unbounded-queue-oom.md
        annotations:
          summary: "자막 발행 큐가 상한의 50%를 넘었다"
          description: >-
            큐 {{ $value | humanizePercentage }} 점유. 정상 상태에서는 초당 몇 조각이라
            상한(256)에 붙을 일이 없다. 여기가 차면 곧 오래된 자막부터 버려진다.

  - name: edumeet-async-write
    interval: 15s
    rules:
      # ────────────────────────────────────────────────────────────────
      # 근거: performance/13-caption-archive-transcript.md
      #
      #   final 자막은 브로드캐스트 뒤 비동기로 저장한다. 화면 표시가 DB 를 기다리지
      #   않게 하려는 것이다. 대가는 "저장이 밀리면 요약 입력이 빈다" 이다.
      #
      #   드롭은 상한을 넘겨 버린 것이라 0 이 아니면 이미 자막이 유실됐다.
      #   경고가 아니라 즉시 봐야 한다.
      - alert: CaptionArchiveDropping
        expr: increase(caption_archive_dropped_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          runbook: docs/performance/13-caption-archive-transcript.md
        annotations:
          summary: "final 자막이 저장 큐에서 버려지고 있다"
          description: >-
            5분간 {{ $value | printf "%.0f" }}건 유실. 유실된 자막은 다시보기에도,
            회의 후 요약 입력에도 들어가지 않는다. 화면에는 이미 지나갔으므로 복구할 원본이 없다.

      # 근거: 같은 문서. 큐가 계속 차 있다는 것은 flush 가 유입을 못 따라간다는 뜻이다.
      - alert: CaptionArchiveBacklog
        expr: chat_archive_queued > 0 and caption_archive_queued > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "비동기 저장 큐가 10분째 비지 않는다"
          description: >-
            저장이 유입을 못 따라가고 있다. 이 상태가 이어지면 상한에 닿아 유실로 바뀐다.

  - name: edumeet-silent-failures
    interval: 15s
    rules:
      # ────────────────────────────────────────────────────────────────
      # ★ 근거: performance/10-websocket-behind-proxy.md
      #
      #   nginx proxy_read_timeout 기본값 60초가 조용한 WebSocket 연결을 끊는다.
      #     60s (기본값)  60.9초에 3/3 끊김
      #     3600s         90.1초에 0/3
      #
      #   이 버그의 성질이 중요하다 -
      #     에러 로그가 안 남는다. 개발 중엔 안 보인다. 트래픽이 있으면 가려진다.
      #
      #   그래서 "에러를 세는" 경보로는 절대 안 잡힌다.
      #   대신 세션 수가 규칙적으로 깎이는 모양을 본다.
      #   설정이 되돌아가면(재배포·설정 롤백) 이 경보가 잡는다.
      - alert: WebSocketSessionsDroppingSteadily
        expr: |
          chat_sessions_active > 0
            and delta(chat_sessions_active[3m]) < -5
            and rate(chat_messages_published_total[3m]) < 0.1
        for: 3m
        labels:
          severity: warning
          runbook: docs/performance/10-websocket-behind-proxy.md
        annotations:
          summary: "조용한 연결이 규칙적으로 끊기고 있다 (프록시 타임아웃 의심)"
          description: >-
            3분간 세션 {{ $value | printf "%.0f" }}개 감소. 그동안 발행은 거의 없었다.
            nginx proxy_read_timeout 이 기본값(60초)으로 되돌아갔는지 확인한다.
            이 버그는 에러 로그를 남기지 않으므로 로그로는 안 보인다.

      # 관측 자체가 죽는 경우. #83 에서 관측이 시작조차 안 되던 적이 있다.
      #
      # ★ 슬롯마다 묻지 않고 합쳐서 묻는다. (#180)
      #   앱은 blue/green 두 슬롯이고 한 번에 하나만 돈다.
      #   안 도는 쪽은 늘 up=0 이라, 슬롯마다 물으면 상시 울린다 -
      #   #178 에서 로그 경보가 딱 그 모양으로 상시 울리고 있었다.
      #   묻고 싶은 것은 "**하나도 안 뜬다**" 이지 "하나가 안 뜬다" 가 아니다.
      - alert: AppMetricsUnreachable
        expr: |
          sum(up{job="edumeet-app"}) == 0 or absent(up{job="edumeet-app"})
        for: 2m
        labels:
          severity: critical
          runbook: docs/ops/04-observability.md
        annotations:
          summary: "앱 지표를 긁지 못한다"
          description: >-
            2분째 스크레이프 실패. 앱이 죽었거나 관리 포트가 닫혔다.
            이 경보가 울리는 동안 다른 모든 경보는 침묵한다 - 그래서 이것이 critical 이다.

  - name: edumeet-errors
    interval: 15s
    rules:
      # ────────────────────────────────────────────────────────────────
      # ★ 로그가 아니라 지표로 센다. (#167)
      #
      #   로그 스택을 붙이고 나면 "에러 로그가 늘면 경보" 를 Loki 에 걸고 싶어진다.
      #   그런데 Micrometer 가 이미 logback_events_total 을 낸다.
      #   같은 것을 두 곳에서 세면 둘이 갈라지고, 갈라지면 어느 쪽이 맞는지 모른다.
      #
      #   그리고 Loki 규칙은 로그가 실제로 도착해야 평가된다.
      #   수집기가 죽으면 경보가 "정상" 으로 보인다 - 이 저장소가 여러 번 잡은 모양이다.
      #   지표 쪽은 앱이 직접 내므로 수집기와 무관하다.
      #
      # ★ 임계값의 근거
      #
      #   정상 상태의 에러는 0 이다. 이 앱의 에러 로그는 예외 경로에서만 나오고,
      #   부하 측정 중에도 (자막 드롭 같은 것은 WARN 이라) ERROR 는 안 찍혔다.
      #
      #   그래서 "0 이 아니면" 이 아니라 "5분에 5건 이상" 으로 둔다.
      #   한 건은 일시적 외부 호출 실패로도 난다. 다섯 건이면 반복되는 것이다.
      #
      #   그리고 이 경보가 울렸을 때 볼 곳이 이제 있다 - Loki 의 로그 대시보드다.
      #   그게 없을 때 이 경보를 넣었으면 "울렸는데 볼 게 없는" 상태가 됐다.
      - alert: ErrorLogsRising
        expr: increase(logback_events_total{level="error"}[5m]) > 5
        for: 0m
        labels:
          severity: warning
          runbook: docs/ops/16-logs.md
        annotations:
          summary: "에러 로그가 5분에 5건을 넘었다"
          description: >-
            5분간 {{ $value | printf "%.0f" }}건. 정상 상태의 에러는 0 이다.
            Grafana 의 "EduMeet 로그" 대시보드에서 같은 시각을 본다.
            requestId 로 같은 요청의 다른 줄을 따라갈 수 있다.

      # ────────────────────────────────────────────────────────────────
      # 로그가 아예 안 들어오는 경우. (#167)
      #
      #   수집기가 죽으면 로그 대시보드가 조용히 빈다. 그런데 "빈 화면" 은
      #   "아무 일도 없었다" 와 구분되지 않는다.
      #   이 저장소가 반복해서 잡은 모양이라 여기도 같이 막는다.
      #
      #   앱은 부하가 없어도 최소한 무언가는 찍는다(스케줄러, 커넥션 풀 등).
      #   10분간 한 줄도 안 늘었으면 로그 경로가 끊긴 것이다.
      #
      # ★ 반드시 합친 뒤에 0 인지 묻는다. (#178)
      #
      #   logback_events_total 에는 level 라벨이 있다. 합치지 않으면
      #   Prometheus 가 수준마다 따로 평가한다 - 그러면
      #   "ERROR 가 10분간 0건" 이 경보가 된다. 그건 정상이다.
      #   실제로 debug·trace·warn·error 네 개가 상시 firing 이었다.
      #
      #   상시 울리는 경보는 안 울리는 것보다 나쁘다. 사람이 채널을 끄면
      #   그 뒤로는 진짜 경보도 같이 안 보인다.
      #
      #   이 결함이 오늘 드러난 이유가 있다 - 이 규칙은 #167 에 쓰였지만
      #   Prometheus 가 설정을 다시 읽은 적이 없어(#174) 한 번도 평가된 적이
      #   없었다. 리로드를 고치자 그날로 드러났다.
      #
      # ★ instance 도 남기면 안 된다. (#184)
      #
      #   처음엔 `sum by (job, instance)` 로 고쳤다. 슬롯이 하나일 때는 맞았다.
      #   그런데 무중단 배포(#180)로 슬롯이 둘이 되자 **그 라벨이 다시 갈랐다** -
      #   갓 뜬 슬롯은 카운터가 0에서 시작해 잠깐 증가분이 0으로 잡힌다.
      #   배포마다 그 순간이 온다.
      #
      #   묻고 싶은 것은 "이 인스턴스가 로그를 남기나" 가 아니라
      #   **"앱이 로그를 남기나"** 다. 라벨을 남길 때마다
      #   "이 라벨로 갈라서 물어도 뜻이 같은가" 를 봐야 한다.
      - alert: NoLogsFromApp
        expr: sum by (job) (increase(logback_events_total[10m])) == 0
        for: 5m
        labels:
          severity: warning
          runbook: docs/ops/16-logs.md
        annotations:
          summary: "앱이 10분째 로그를 한 줄도 안 남겼다"
          description: >-
            로그 경로가 끊겼거나 로깅 설정이 바뀌었다. 빈 대시보드는
            "아무 일도 없었다" 와 구분되지 않으므로 지표 쪽에서 따로 묻는다.

  - name: edumeet-broadcast
    interval: 15s
    rules:
      # ────────────────────────────────────────────────────────────────
      # 재시작이 방송을 끊었다. (#168)
      #
      #   송출 세션은 메모리에만 있어서 앱이 재시작되면 ffmpeg 가 같이 죽는다.
      #   DB 플래그는 남아 발표자 화면이 계속 "방송 중" 으로 보이고,
      #   시청자는 세그먼트가 안 늘어나는데 에러가 한 줄도 안 난다.
      #
      #   기동 시 정리가 그 상태를 사실에 맞춘다. 다만 정리했다는 것은
      #   "직전 배포가 누군가의 방송을 끊었다" 는 뜻이므로 알아야 한다.
      #   되살릴 수는 없다 - 발표자 브라우저가 조각을 밀어 넣어야 이어진다.
      - alert: BroadcastKilledByRestart
        expr: increase(broadcast_stale_reconciled_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
          runbook: docs/ops/17-broadcast-liveness.md
        annotations:
          summary: "재시작이 진행 중이던 방송을 끊었다"
          description: >-
            {{ $value | printf "%.0f" }}건을 정리했다. 발표자가 다시 시작해야 한다.
            배포 창을 방송 시간과 겹치지 않게 잡는 것이 근본 대책이다.

      # ────────────────────────────────────────────────────────────────
      # 아무도 안 듣는데 인코딩 중. (#168)
      #
      #   2코어에서 방송 하나가 CPU 를 쓴다. 동시 상한이 2라
      #   안 보는 방송이 하나 있으면 볼 사람이 있는 방송이 못 시작할 수 있다.
      #
      #   for 를 길게 잡은 이유 - 방송을 켜고 시청자가 들어오기까지는
      #   비어 있는 것이 정상이다. 10분이면 그 구간이 아니다.
      - alert: BroadcastUnwatched
        expr: broadcast_unwatched > 0
        for: 10m
        labels:
          severity: warning
          runbook: docs/ops/17-broadcast-liveness.md
        annotations:
          summary: "10분째 아무도 안 듣는 방송이 있다"
          description: >-
            {{ $value | printf "%.0f" }}개. 세그먼트를 만들어 두고 아무도 안 가져간다.
            자동으로 멈추지 않는다 - 발표자가 의도해서 켠 것이므로 끄는 판단은 사람이 한다.

  # ══════════════════════════════════════════════════════════════════
  #  호스트 자원. (#173)
  #
  #  ★ 왜 뒤늦게 생겼나 - 디스크가 86% 인 것을 손으로 df 를 쳐서 알았다.
  #    46GB 중 39GB 를 쓰고 있었고, 그중 9.2GB 가 배포하고 버린 이미지였다.
  #    배포 파이프라인이 이미지를 쌓기만 하고 지우지 않았다(96개).
  #
  #    디스크가 차면 앱만 죽는 게 아니다. 같은 볼륨 위에 MySQL·Loki·Prometheus 가
  #    전부 쓰고 있어서, 관측 스택도 같이 멈춘다 - 무슨 일인지 볼 수단까지 사라진다.
  # ══════════════════════════════════════════════════════════════════
  - name: edumeet-host
    interval: 30s
    rules:
      # ────────────────────────────────────────────────────────────────
      # 근거: 배포 한 번이 이미지 945MB 를 받는다.
      #
      #   배포는 pull 로 시작한다. 받을 자리가 없으면 그 배포부터 실패하고,
      #   되돌릴 수도 없다 - 되돌리는 것도 pull 이다.
      #   그래서 임계값은 "얼마나 찼나" 가 아니라 "한 번 더 배포할 수 있나" 로 묻는다.
      #
      #   3GB - 이미지 945MB 를 받고 압축을 풀 자리(약 2배)에 여유를 조금 둔 값이다.
      #   여기 걸리면 다음 배포는 못 한다고 봐야 한다.
      - alert: DiskTooLowToDeploy
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"} < 3e9
        for: 5m
        labels:
          severity: critical
          runbook: docs/ops/20-disk.md
        annotations:
          summary: "디스크 여유가 배포 한 번을 못 버틴다"
          description: >-
            남은 공간 {{ $value | humanize1024 }}B. 배포는 945MB 이미지를 받는 것으로
            시작하므로 이 상태에서는 배포도 롤백도 실패한다.
            docker images 를 먼저 본다 - 지금까지 항상 여기였다.

      # ────────────────────────────────────────────────────────────────
      # 근거: 실측한 증가 속도.
      #
      #   배포 한 번에 약 106MB 늘었다 (미사용 이미지 9.249GB / 87개).
      #   가장 바쁜 날 배포가 27회였으니 하루 최대 2.9GB 다.
      #   그 속도면 46GB 디스크는 여유 15GB 에서 5일이면 찬다.
      #
      #   이미지 정리를 배포에 넣었으니 그 요인은 사라졌다. 그런데
      #   같은 크기의 새 요인(로그·지표·업로드)이 생기면 똑같이 조용히 찬다.
      #   그래서 "무엇이 차는지" 가 아니라 "이 속도면 언제 차는지" 를 묻는다.
      #
      #   4일 - 금요일에 울려도 사람이 월요일 전에 본다. 실측한 최악의 속도(2.9GB/일)로는
      #   4일 전에 알면 11GB 를 치울 시간이 있고, 지울 것은 항상 있었다.
      #
      #   6h 창을 쓰는 이유 - 짧게 잡으면 배포 한 번의 계단이 추세로 읽혀 오탐이 된다.
      #
      # ★ 조건이 두 개 더 붙어 있다. 둘 다 오탐을 본 뒤에 붙였다. (#178)
      #
      #   ① 창이 실제로 차 있어야 한다.
      #      수집기를 붙인 지 40분 만에 이 경보가 울렸다.
      #      6시간 창에 40분치만 있으면 그 짧은 구간의 기울기를 4일로 늘리는 것이고,
      #      그러면 아무 숫자나 나온다 - 실제로 "4일 뒤 -145GB" 가 나왔다.
      #      scrape 가 15초이므로 6시간이면 표본 1,440개다. 절반(3시간)은 차야
      #      추세라고 부른다.
      #
      #   ② 여유가 이미 적어야 한다.
      #      실측한 최악의 증가 속도가 2.9GB/일이다. 4일이면 11.6GB.
      #      여유가 그보다 많은데 "4일 뒤 0" 이 나온다면 그건 우리가 관측한 적
      #      없는 속도라는 뜻이고, 그런 기울기는 추세가 아니라 계단이다
      #      (정리 직후처럼). 12GB 를 문턱으로 둔다.
      #
      #   즉 "빨리 줄고 있다" 만으로는 안 울린다. "빨리 줄고 있고, 이미 얼마 없다" 여야 한다.
      - alert: DiskFillingUp
        expr: |
          (
            predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 4 * 24 * 3600) < 0
            and node_filesystem_avail_bytes{mountpoint="/"} < 12e9
          )
          and on (device, mountpoint, instance)
            count_over_time(node_filesystem_avail_bytes{mountpoint="/"}[6h]) > 720
        for: 30m
        labels:
          severity: warning
          runbook: docs/ops/20-disk.md
        annotations:
          summary: "지금 속도면 4일 안에 디스크가 찬다"
          description: >-
            지금 추세를 그대로 늘리면 4일 안에 0 이 된다.
            디스크가 차면 MySQL·Loki·Prometheus 가 같이 멈춘다 -
            무슨 일인지 볼 수단까지 사라진다는 뜻이다.
            docker system df 와 du -sh /var/lib/docker 부터 본다.

      # ────────────────────────────────────────────────────────────────
      # 근거: 이 경보군 자체가 조용히 끊길 수 있다. (#139 의 ②)
      #
      #   위 두 규칙은 node-exporter 가 살아 있어야 값이 나온다.
      #   수집기가 죽으면 질의는 에러가 아니라 빈 결과를 내고,
      #   빈 결과는 "정상" 과 구분되지 않는다 - 디스크가 차도 아무 일도 안 일어난다.
      #
      #   그래서 "지표가 없다" 를 따로 묻는다.
      - alert: HostMetricsMissing
        expr: |
          up{job="node"} == 0 or absent(up{job="node"})
        for: 10m
        labels:
          severity: warning
          runbook: docs/ops/20-disk.md
        annotations:
          summary: "호스트 지표가 끊겼다 - 디스크 경보가 무의미해졌다"
          description: >-
            node-exporter 를 못 긁고 있다. 이 상태에서는 위의 디스크 경보가
            빈 결과를 내므로 영원히 안 울린다. 경보가 조용한 것이 안전하다는 뜻이 아니다.

  # ══════════════════════════════════════════════════════════════════
  #  백업. (#175)
  #
  #  ★ 백업은 "선언은 있는데 안 쓴다" 의 교과서다.
  #    덤프가 매일 쌓이는 것을 보면 일이 된 것 같은데, 그 파일로 DB 를
  #    세울 수 있는지는 아무도 확인하지 않는다. 확인하는 날은 이미 늦은 날이다.
  #
  #    그래서 두 가지를 따로 묻는다 - 뜨고 있나, 그리고 그것으로 세워지나.
  #
  #  지표는 systemd 타이머가 파일로 쓰고 node-exporter 가 읽어 올린다
  #  (textfile 수집기). 컨테이너가 아닌 것의 상태를 Prometheus 로 올리는 통로다.
  # ══════════════════════════════════════════════════════════════════
  - name: edumeet-backup
    interval: 60s
    rules:
      # ────────────────────────────────────────────────────────────────
      # 근거: 타이머가 매일 04:00 에 돈다. 흩는 폭이 15분이다.
      #
      #   하루를 건너뛴 것은 서버가 꺼져 있었을 수 있다(Persistent=true 라
      #   다음 부팅에 한 번 돈다). 이틀을 건너뛰면 그것으로 설명되지 않는다.
      #
      #   36시간 - 하루 주기에서 한 회차를 놓친 것은 봐주고,
      #   두 회차째부터 울린다. 매일 04:00 기준으로 다음 날 16:00 쯤이다.
      - alert: BackupStale
        expr: |
          time() - edumeet_backup_last_success_timestamp_seconds > 36 * 3600
        for: 10m
        labels:
          severity: critical
          runbook: docs/ops/21-backup.md
        annotations:
          summary: "백업이 36시간째 성공하지 않았다"
          description: >-
            마지막 성공이
            {{ $value | humanizeDuration }} 전이다. 타이머가 죽었거나 덤프가 실패하고 있다.
            systemctl status edumeet-backup.timer 와 journalctl -u edumeet-backup 을 본다.

      # ────────────────────────────────────────────────────────────────
      # 근거: 지표가 아예 없으면 위 규칙도 빈 결과를 낸다.
      #
      #   백업 스크립트는 실패해도 지표를 쓴다(성공 0). 그러니 지표 자체가
      #   없다는 것은 스크립트가 한 번도 안 돌았거나 textfile 경로가 끊겼다는 뜻이다.
      #   이 경우 BackupStale 은 영원히 안 울린다 - 빈 결과는 "정상" 과 같다.
      # ★ 훈련 지표도 같이 본다.
      #
      #   처음엔 백업 지표만 봤다. 그런데 훈련 지표가 없으면
      #   RestoreDrillStale 도 똑같이 빈 결과를 낸다 - 훈련이 한 번도
      #   안 돌아도 조용하다. 막으려던 함정을 규칙 하나 옆에 그대로 다시 팠다.
      - alert: BackupMetricsMissing
        expr: |
          absent(edumeet_backup_last_success_timestamp_seconds)
            or absent(edumeet_restore_drill_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
          runbook: docs/ops/21-backup.md
        annotations:
          summary: "백업 또는 복구 훈련 지표가 없다 - 그쪽 경보가 무의미해졌다"
          description: >-
            타이머가 한 번도 안 돌았거나 node-exporter 의 textfile 경로가 끊겼다.
            이 상태에서는 BackupStale·RestoreDrillStale 이 빈 결과를 내므로
            영원히 안 울린다. 빈 결과는 "정상" 과 구분되지 않는다.

      # ────────────────────────────────────────────────────────────────
      # 근거: 복구 훈련은 매주 일요일 05:00 이다. 흩는 폭이 30분이다.
      #
      #   9일 - 한 주를 통째로 놓친 것을 잡는다. 주 주기라 하루 이틀 밀리는 것은
      #   정상 범위이고, 9일이면 확실히 한 회차를 건너뛴 것이다.
      #
      # ★ 이 경보가 왜 별도인가 - 백업이 매일 성공해도 그 파일로 DB 를
      #   세울 수 없으면 백업이 없는 것과 같다. 실제로 확인해 봤을 때만
      #   "있다" 고 말할 수 있다.
      - alert: RestoreDrillStale
        expr: |
          time() - edumeet_restore_drill_timestamp_seconds > 9 * 24 * 3600
        for: 30m
        labels:
          severity: warning
          runbook: docs/ops/21-backup.md
        annotations:
          summary: "복구 훈련이 9일째 안 돌았다"
          description: >-
            덤프는 쌓이고 있어도 그것으로 DB 를 세울 수 있는지는 확인되지 않았다.
            systemctl start edumeet-restore-drill 로 지금 돌려 본다.

      # ────────────────────────────────────────────────────────────────
      # 근거: 훈련은 복구본과 운영의 행 수를 표마다 대조한다.
      #       하나라도 다르면 0 을 쓴다.
      #
      #   for 를 짧게 잡은 이유 - 이 값은 주 1회만 바뀐다. 오래 기다릴 이유가 없고,
      #   기다리는 동안 다음 훈련까지 일주일이 지나간다.
      - alert: RestoreDrillFailed
        expr: |
          edumeet_restore_drill_success == 0
        for: 5m
        labels:
          severity: critical
          runbook: docs/ops/21-backup.md
        annotations:
          summary: "백업으로 DB 를 세우지 못했다"
          description: >-
            덤프는 있는데 복구본이 운영과 다르다. 지금 있는 백업으로는
            돌아갈 수 없다고 봐야 한다. journalctl -u edumeet-restore-drill 을 본다.
