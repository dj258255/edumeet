# 경보 규칙. (#139)
#
# ★ 임계값마다 근거를 적는다.
#
#   대부분의 경보는 "CPU > 80%" 처럼 근거 없는 숫자를 쓴다. 그러면 두 가지가 생긴다 -
#   울려도 무엇을 해야 할지 모르고, 안 울려도 안전한지 알 수 없다.
#
#   이 저장소는 붕괴 지점을 이미 쟀다. 그 측정을 임계값의 근거로 쓴다.
#   근거를 못 대는 규칙은 여기 넣지 않는다.
#
# ★ 절대값이 아니라 비율로 묻는다.
#
#   큐 상한을 코드에서 바꿨는데 경보가 옛 절대값을 물어보면 경보는 조용히 무의미해진다.
#   그래서 앱이 capacity 도 지표로 낸다.

groups:
  - name: edumeet-chat
    interval: 15s
    rules:
      # ────────────────────────────────────────────────────────────────
      # 근거: performance/07-chat-unbounded-queue-oom.md
      #
      #   느린 소비자(Toxiproxy 5KB/s)에서 큐가 1,077,906 까지 쌓여 84초에 OOM.
      #   같은 부하·같은 힙에서 빠른 소비자는 큐 최대 525 였다.
      #   상한 2만을 걸어 84초 OOM -> 444초 무중단이 됐다.
      #
      #   즉 상한이 있으니 이제 OOM 으로는 안 죽는다. 대신 CallerRunsPolicy 로
      #   역압이 위로 가서 "발행하는 쪽이 느려진다". 그것을 보려면 큐 점유율을 본다.
      #
      #   50% 를 고른 이유 - 빠른 소비자 정상 상태의 최대가 525(상한의 2.6%)였다.
      #   50% 는 정상 변동의 20배 위라 오탐이 아니다.
      #
      # ★ 다만 "사람이 볼 시간이 남는다" 는 틀렸다. 재 봤다. (#143)
      #
      #   무한 큐 실험의 순증이 초당 12,832건이었다(1,077,906 / 84초).
      #   상한 20,000 기준으로 환산하면
      #
      #       50% -> 100%   0.78초
      #       0   -> 100%   1.56초
      #
      #   scrape_interval 이 15초이고 for 가 1분이다.
      #   그 부하에서는 경보가 평가되기도 전에 큐가 찬다.
      #
      #   이 경보가 유효한 창은 좁다 - 15초의 여유를 주려면 순증이 667건/s 이하여야
      #   하는데, 그 부하의 총 전달 요구가 초당 36,000건이므로
      #   소비가 98.15% 이상 따라잡고 있을 때만 그렇다.
      #
      #   그래서 이 경보의 역할을 다시 적는다 -
      #   급성 붕괴를 막는 것은 상한과 CallerRunsPolicy 다. 이 경보는 그보다
      #   완만한 열화(소비가 조금씩 밀리는 구간)를 잡고, 급성 구간에서는
      #   "무슨 일이 있었나" 를 사후에 알려 주는 기록으로 쓴다.
      - alert: ChatOutboundQueueGrowing
        expr: |
          chat_channel_queued{channel="out"}
            / chat_channel_capacity{channel="out"} > 0.5
        for: 1m
        labels:
          severity: warning
          runbook: docs/performance/07-chat-unbounded-queue-oom.md
        annotations:
          summary: "채팅 아웃바운드 큐가 상한의 50%를 넘었다 (완만한 열화 감지용)"
          description: >-
            큐 {{ $value | humanizePercentage }} 점유. 정상 상태 최대는 상한의 2.6%(525개)였다.
            상한이 있어 OOM 으로 죽지는 않지만, CallerRunsPolicy 때문에
            브로드캐스트를 시작한 스레드가 전송을 떠안는다 - 채팅은 chat-in- 실행기,
            자막은 Tomcat HTTP 요청 스레드다. 후자면 REST API 전체가 느려진다.
            급성 붕괴(순증 1만/s 이상)에서는 이 경보가 늦다. 그때는 사후 기록으로 읽는다.

      # ────────────────────────────────────────────────────────────────
      # 근거: 같은 문서. 상한에 붙었다는 것은 역압이 이미 발행 경로에 걸렸다는 뜻이다.
      - alert: ChatOutboundQueueAtCapacity
        expr: |
          chat_channel_queued{channel="out"}
            / chat_channel_capacity{channel="out"} > 0.9
        for: 30s
        labels:
          severity: critical
          runbook: docs/performance/07-chat-unbounded-queue-oom.md
        annotations:
          summary: "채팅 아웃바운드 큐가 상한에 붙었다"
          description: >-
            큐 {{ $value | humanizePercentage }} 점유. 이 시점부터 발행하는 스레드가
            직접 전송을 떠안는다(CallerRunsPolicy). 메시지는 안 버려지지만 전체가 느려진다.

      # ────────────────────────────────────────────────────────────────
      # 근거: performance/09-chat-capacity-oci.md
      #
      #   fan-out 워크로드에서 200명 -> 500명에 e2e 지연이 45ms -> 1,313ms 로 29배가 됐다.
      #   그때 연결은 하나도 안 끊겼다. 무너진 것은 지연이다.
      #   "몇 명이 붙나" 가 아니라 "몇 명까지 채팅답나" 가 상한이다.
      #
      #   fan-out 대상 수를 보는 이유 - 발행 1건이 구독자 수만큼 작업을 만든다.
      #   증폭기가 커지는 것이 지연보다 먼저 보인다.
      - alert: ChatFanoutAmplificationHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(chat_fanout_recipients_bucket[5m]))) > 200
        for: 5m
        labels:
          severity: warning
          runbook: docs/performance/09-chat-capacity-oci.md
        annotations:
          summary: "발행 1건당 전달 대상이 200을 넘었다 (p95)"
          description: >-
            p95 {{ $value | printf "%.0f" }}명. 200명에서 e2e p95 가 45ms 였고
            500명에서 1,313ms(29배)가 됐다. 이 값이 계속 오르면 지연이 먼저 무너진다.

  - name: edumeet-caption-broadcast
    interval: 15s
    rules:
      # ────────────────────────────────────────────────────────────────
      # 근거: performance/07 · #151
      #
      #   자막 발행은 채팅과 정책이 다르다. 채팅은 이어지는 대화라 안 버리고 느려지지만
      #   (CallerRunsPolicy), 자막은 최신성이 중요해서 밀리면 오래된 것부터 버린다.
      #   5초 밀린 자막은 화면의 음성과 안 맞아 없는 것보다 나쁘기 때문이다.
      #
      #   그래서 여기서 물어야 하는 것은 "버렸는가" 다. 조용히 버리면
      #   "자막이 원래 띄엄띄엄 나오나 보다" 로 읽히고 아무도 이상하다고 느끼지 않는다.
      #
      #   전사는 저장 큐가 따로 들고 있으므로 이 드롭은 다시보기·요약을 망가뜨리지 않는다.
      #   그래서 저장 드롭(critical)과 달리 warning 이다.
      - alert: CaptionBroadcastDropping
        expr: increase(caption_broadcast_dropped_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          runbook: docs/performance/07-chat-unbounded-queue-oom.md
        annotations:
          summary: "실시간 자막이 화면에 못 나가고 버려지고 있다"
          description: >-
            5분간 {{ $value | printf "%.0f" }}건이 발행 큐에서 버려졌다. 화면에서만 사라지고
            전사에는 남는다. 아웃바운드가 포화했는지, 구독자가 몰렸는지 함께 본다.

      # 근거: 같은 곳. 큐가 차 있다는 것은 화면 자막이 이미 밀리고 있다는 뜻이다.
      - alert: CaptionBroadcastQueueBacklogged
        expr: |
          caption_broadcast_queued / caption_broadcast_capacity > 0.5
        for: 1m
        labels:
          severity: warning
          runbook: docs/performance/07-chat-unbounded-queue-oom.md
        annotations:
          summary: "자막 발행 큐가 상한의 50%를 넘었다"
          description: >-
            큐 {{ $value | humanizePercentage }} 점유. 정상 상태에서는 초당 몇 조각이라
            상한(256)에 붙을 일이 없다. 여기가 차면 곧 오래된 자막부터 버려진다.

  - name: edumeet-async-write
    interval: 15s
    rules:
      # ────────────────────────────────────────────────────────────────
      # 근거: performance/13-caption-archive-transcript.md
      #
      #   final 자막은 브로드캐스트 뒤 비동기로 저장한다. 화면 표시가 DB 를 기다리지
      #   않게 하려는 것이다. 대가는 "저장이 밀리면 요약 입력이 빈다" 이다.
      #
      #   드롭은 상한을 넘겨 버린 것이라 0 이 아니면 이미 자막이 유실됐다.
      #   경고가 아니라 즉시 봐야 한다.
      - alert: CaptionArchiveDropping
        expr: increase(caption_archive_dropped_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          runbook: docs/performance/13-caption-archive-transcript.md
        annotations:
          summary: "final 자막이 저장 큐에서 버려지고 있다"
          description: >-
            5분간 {{ $value | printf "%.0f" }}건 유실. 유실된 자막은 다시보기에도,
            회의 후 요약 입력에도 들어가지 않는다. 화면에는 이미 지나갔으므로 복구할 원본이 없다.

      # 근거: 같은 문서. 큐가 계속 차 있다는 것은 flush 가 유입을 못 따라간다는 뜻이다.
      - alert: CaptionArchiveBacklog
        expr: chat_archive_queued > 0 and caption_archive_queued > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "비동기 저장 큐가 10분째 비지 않는다"
          description: >-
            저장이 유입을 못 따라가고 있다. 이 상태가 이어지면 상한에 닿아 유실로 바뀐다.

  - name: edumeet-silent-failures
    interval: 15s
    rules:
      # ────────────────────────────────────────────────────────────────
      # ★ 근거: performance/10-websocket-behind-proxy.md
      #
      #   nginx proxy_read_timeout 기본값 60초가 조용한 WebSocket 연결을 끊는다.
      #     60s (기본값)  60.9초에 3/3 끊김
      #     3600s         90.1초에 0/3
      #
      #   이 버그의 성질이 중요하다 -
      #     에러 로그가 안 남는다. 개발 중엔 안 보인다. 트래픽이 있으면 가려진다.
      #
      #   그래서 "에러를 세는" 경보로는 절대 안 잡힌다.
      #   대신 세션 수가 규칙적으로 깎이는 모양을 본다.
      #   설정이 되돌아가면(재배포·설정 롤백) 이 경보가 잡는다.
      - alert: WebSocketSessionsDroppingSteadily
        expr: |
          chat_sessions_active > 0
            and delta(chat_sessions_active[3m]) < -5
            and rate(chat_messages_published_total[3m]) < 0.1
        for: 3m
        labels:
          severity: warning
          runbook: docs/performance/10-websocket-behind-proxy.md
        annotations:
          summary: "조용한 연결이 규칙적으로 끊기고 있다 (프록시 타임아웃 의심)"
          description: >-
            3분간 세션 {{ $value | printf "%.0f" }}개 감소. 그동안 발행은 거의 없었다.
            nginx proxy_read_timeout 이 기본값(60초)으로 되돌아갔는지 확인한다.
            이 버그는 에러 로그를 남기지 않으므로 로그로는 안 보인다.

      # 관측 자체가 죽는 경우. #83 에서 관측이 시작조차 안 되던 적이 있다.
      - alert: AppMetricsUnreachable
        expr: up{job="edumeet-app"} == 0
        for: 2m
        labels:
          severity: critical
          runbook: docs/ops/04-observability.md
        annotations:
          summary: "앱 지표를 긁지 못한다"
          description: >-
            2분째 스크레이프 실패. 앱이 죽었거나 관리 포트가 닫혔다.
            이 경보가 울리는 동안 다른 모든 경보는 침묵한다 - 그래서 이것이 critical 이다.
