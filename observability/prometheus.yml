# Prometheus 스크레이프 설정 (#28)
#
# 앱의 관리 포트(9090)를 컨테이너 네트워크 안에서 긁는다.
# 이 포트는 호스트로 publish 되지 않으므로 인터넷에서는 닿지 않는다.

global:
  # 5초는 과하고 60초는 붕괴 순간을 놓친다. 부하 시험 중에도 형태가 보이는 값.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod

# 경보 규칙. (#139)
#
# 파일을 두는 것만으로는 부족하다 - Prometheus 가 실제로 로드했는지는
# /api/v1/rules 로 물어봐야 안다. 그 확인을 scripts/verify-alerting.sh 가 한다.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ★ 슬롯 둘을 다 긁는다. (#180)
  #
  #   앱은 blue/green 두 슬롯이고 한 번에 하나만 돈다. 안 도는 쪽은
  #   스크레이프가 실패해 up=0 이 되는데, 그게 정상이다.
  #   그래서 "앱을 못 긁는다" 경보는 하나가 0인지가 아니라
  #   **둘 다 0인지**를 묻는다.
  #
  #   별칭(app)으로 긁지 않는 이유 - 전환 중에는 둘 다 떠 있어서
  #   DNS 가 번갈아 답한다. 그러면 지표가 두 프로세스 사이를 오간다.
  - job_name: edumeet-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-blue:9090", "app-green:9090"]
        labels:
          service: edumeet

  # Prometheus 자기 자신. 스크레이프가 밀리는지 봐야 지표를 믿을 수 있다.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Alertmanager 자신. 경보를 받아 주는 쪽이 죽으면 경보가 조용히 사라진다.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # 호스트 자원. (#173)
  # 앱 지표만 긁으면 "디스크가 찼다" 를 물어볼 지표가 아예 없다.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: edumeet
