# Prometheus 스크레이프 설정 (#28)
#
# 앱의 관리 포트(9090)를 컨테이너 네트워크 안에서 긁는다.
# 이 포트는 호스트로 publish 되지 않으므로 인터넷에서는 닿지 않는다.

global:
  # 5초는 과하고 60초는 붕괴 순간을 놓친다. 부하 시험 중에도 형태가 보이는 값.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod

# 경보 규칙. (#139)
#
# 파일을 두는 것만으로는 부족하다 - Prometheus 가 실제로 로드했는지는
# /api/v1/rules 로 물어봐야 안다. 그 확인을 scripts/verify-alerting.sh 가 한다.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: edumeet-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:9090"]
        labels:
          service: edumeet

  # Prometheus 자기 자신. 스크레이프가 밀리는지 봐야 지표를 믿을 수 있다.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Alertmanager 자신. 경보를 받아 주는 쪽이 죽으면 경보가 조용히 사라진다.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # 호스트 자원. (#173)
  # 앱 지표만 긁으면 "디스크가 찼다" 를 물어볼 지표가 아예 없다.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: edumeet
