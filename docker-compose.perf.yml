# 부하 측정 전용 환경.
#
# 기존 성능 측정은 H2 로 했다. H2 는 옵티마이저·인덱스·커넥션 풀 동작이 MySQL 과
# 달라서 "쿼리 83개가 5개로 줄었다"가 실제로 몇 ms 인지 말해주지 못한다.
# 운영과 같은 MySQL 8.0 에서 다시 잰다.
#
#   docker compose -f docker-compose.perf.yml up -d
#
# 포트는 3307/6380 을 쓴다. 개발용 MySQL(3306)과 충돌하지 않게 하기 위해서다.

services:
  mysql:
    image: mysql:8.0
    container_name: edumeet-perf-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: perfroot
      MYSQL_DATABASE: edumeet_perf
      MYSQL_USER: edumeet
      MYSQL_PASSWORD: perfpass
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 측정 환경을 고정한다. 기본값에 맡기면 머신마다 다른 수치가 나온다.
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
      # 느린 쿼리를 남긴다. N+1 이 실제로 어떤 SQL 로 나가는지 확인하는 용도다.
      - --slow-query-log=1
      - --long-query-time=0.1
      - --slow-query-log-file=/var/lib/mysql/slow.log
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pperfroot"]
      interval: 3s
      timeout: 5s
      retries: 20

  # 실제 LiveKit 서버. --dev 모드의 기본 자격증명이 devkey/devsecret 이라
  # application-perf.yml 의 설정과 그대로 맞는다.
  livekit:
    image: livekit/livekit-server:latest
    container_name: edumeet-perf-livekit
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"

  # LiveKit 앞에 두고 지연·단절을 주입한다.
  # 앱은 toxiproxy(7881)를 보고, toxiproxy 가 livekit(7880)으로 넘긴다.
  #
  #   앱 --> toxiproxy:7881 --[toxic]--> livekit:7880
  #
  # 8474 는 toxic 을 켜고 끄는 제어 API 다.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    container_name: edumeet-perf-toxiproxy
    ports:
      - "8474:8474"
      - "7881:7881"
      # MySQL 앞에도 둔다. DB 응답에 지연을 넣으면 "센다 -> 비교한다 -> 기록한다"
      # 사이의 창이 넓어져 정원 경합이 우연이 아니라 필연이 된다.
      - "13307:13307"
      # 앱의 WebSocket 앞에도 둔다. (#43)
      #
      #   k6 --> toxiproxy:18081 --[bandwidth toxic]--> host:8081
      #
      # 무한 큐가 위험해지는 조건은 "빠른 발행" 이 아니라 "느린 소비" 다.
      # k6 는 루프백에서 즉시 읽어가므로 아무리 빨리 발행해도 큐가 빠진다.
      # 대역폭을 조여야 아웃바운드가 밀리고 큐가 쌓인다.
      - "18081:18081"
    # 앱은 호스트에서 돈다. 컨테이너에서 호스트로 나가야 한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - livekit
      - mysql

  redis:
    image: redis:7-alpine
    container_name: edumeet-perf-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
