name: Deploy

# master 에 머지되면 ARM64 이미지를 만들어 GHCR 에 올리고 OCI 서버에 배포한다.
on:
  push:
    branches: [master]
  workflow_dispatch:        # 수동 재배포용
    inputs:
      deploy_ai:
        description: 'AI 서비스도 배포한다 (기본 아니오)'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false   # 배포는 취소하지 않는다. 중간에 끊기면 상태가 애매해진다

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-image:
    # ★ ARM 네이티브 러너.
    #   OCI A1.Flex 가 aarch64 라 arm64 이미지가 필요한데,
    #   x86 러너에서 QEMU 로 크로스 빌드하면 에뮬레이션이라 수 배 느리다.
    #   public 저장소는 ARM 러너가 무료이므로 네이티브로 굽는다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            # ★ long 이어야 한다. 배포 스크립트가 ${{ github.sha }}(40자)로 당기는데
            #   short(7자)로 푸시하면 같은 커밋인데 이름이 달라 manifest unknown 이 난다. (#45)
            #   배포 쪽에서 자르는 방법도 있지만, 자르는 코드가 하나 더 생기면
            #   또 어긋날 자리가 생긴다. 양쪽이 같은 값을 쓰게 한다.
            type=sha,prefix=,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # 모노레포다. Spring 백엔드만 빌드 컨텍스트로 준다. (#89)
          # 루트를 주면 frontend/ai 의 수백 MB 자산까지 도커 데몬에 전송된다.
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 레이어 캐시를 GitHub Actions 캐시에 둔다. 의존성 레이어 재빌드를 막는다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-latest    # SSH 만 쏘므로 아키텍처 무관
    timeout-minutes: 10
    environment: production   # 승인 게이트를 걸고 싶으면 여기서 설정

    steps:
      - uses: actions/checkout@v4

      # ★ compose 파일, nginx 설정, 관측 설정을 서버로 보낸다.
      #   이전에는 서버의 ~/edumeet 에 있는 파일을 그대로 썼다.
      #   저장소에서 compose 를 고쳐도 서버에는 반영되지 않아서
      #   "머지했는데 왜 안 바뀌지" 가 된다. .env 는 서버에만 두고 건드리지 않는다.
      #   HLS 는 nginx /hls/ 경로 자체가 기능의 일부라 nginx 설정도 같이 동기화한다. (#123)
      - name: Sync deploy config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx/edumeet.conf,observability/**"
          target: "~/edumeet"
          overwrite: true
          strip_components: 0

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          # script_stop 은 ssh-action@v1 에 없는 입력이라 조용히 무시된다.
          # (실행 로그에 Unexpected input(s) 경고로만 남는다)
          # 중간 실패에서 멈추는 것은 아래 set -euo pipefail 이 한다 -
          # 그동안 그게 실제로 일을 하고 있었고 script_stop 은 장식이었다.
          script: |
            set -euo pipefail
            cd ~/edumeet

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export APP_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}

            # 앱 컨테이너의 spring 사용자는 uid/gid 10001 이다. (#123)
            # 이 디렉터리가 root 소유면 ffmpeg 는 시작되지만 첫 세그먼트 생성에서 실패한다.
            # nginx 는 호스트에서 이 경로를 /hls/ 로 서빙한다.
            sudo install -d -o 10001 -g 10001 -m 0755 /var/lib/edumeet/hls

            # nginx 설정도 배포 단위다. (#123)
            # /hls/ location 을 코드에만 두면 운영 URL 은 계속 404 다.
            sudo install -m 0644 deploy/nginx/edumeet.conf /etc/nginx/conf.d/edumeet.conf
            sudo nginx -t
            sudo systemctl reload nginx

            # ★ --profile observability 를 붙인다. (#83)
            #   prometheus·grafana 는 profiles: [observability] 라
            #   프로필 없이 up 하면 "정의는 되어 있는데 뜨지 않는다".
            #   에러도 경고도 안 난다 - compose 는 프로필이 꺼진 서비스를 조용히 건너뛴다.
            #   그래서 관측 스택을 만들고 배포까지 하고도 한 번도 켜진 적이 없었다.
            COMPOSE="docker compose -f docker-compose.prod.yml --profile observability"
            $COMPOSE pull app
            $COMPOSE up -d

            # 관측 스택이 실제로 떴는지 확인한다. 프로필을 붙였다는 사실만으로는 모른다.
            for c in edumeet-prometheus edumeet-grafana; do
              if [ -z "$(docker ps -q -f name=^${c}$)" ]; then
                echo "관측 컨테이너가 뜨지 않았다: $c"
                $COMPOSE logs --tail=50 "${c#edumeet-}"
                exit 1
              fi
            done
            echo "관측 스택 기동 확인"

            # ★ 설정 파일만 바꾸면 Prometheus 는 모른다. (#173)
            #
            #   규칙과 스크레이프 설정은 볼륨으로 마운트돼 있다. scp 로 새 파일을
            #   올려도 컨테이너는 정의가 그대로라 compose 가 다시 만들지 않고,
            #   Prometheus 는 뜰 때 읽은 것을 계속 쓴다.
            #
            #   실제로 그렇게 됐다 - 8월 27일에 뜬 프로세스가 그날의 규칙 7개를
            #   들고 있었고, 그 뒤 커밋한 규칙 9개는 파일에만 있었다.
            #   #139 에서 --web.enable-lifecycle 을 켠 이유가 바로 이 리로드인데
            #   부르는 곳을 안 만들었다. 켜 놓고 안 쓴 것이다.
            #
            #   ★ 리로드를 부르는 것만으로는 부족하다. 확인까지 해야 한다 -
            #     문법이 틀리면 Prometheus 는 새 설정을 버리고 옛것으로 계속 돈다.
            #     200 만 보고 넘어가면 "고쳤는데 안 바뀐" 상태를 또 못 본다.
            PROM="docker exec edumeet-prometheus wget -qO- "
            declared=$(grep -c '^      - alert:' observability/rules/edumeet.yml)

            $PROM --post-data='' http://localhost:9090/-/reload
            sleep 10

            loaded=$($PROM http://localhost:9090/api/v1/rules \
                     | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len([r for g in d["data"]["groups"] for r in g["rules"]]))')

            if [ "$loaded" != "$declared" ]; then
              echo "경보 규칙이 파일과 다르다 - 파일 ${declared}개, 로드 ${loaded}개"
              echo "문법 오류면 Prometheus 가 새 설정을 버리고 옛것으로 돈다. 로그를 본다"
              docker logs --tail 30 edumeet-prometheus
              exit 1
            fi
            echo "경보 규칙 ${loaded}개 로드 확인 (파일과 일치)"

            # ★ 호스트에서 curl 하지 않는다.
            #   actuator 는 관리 포트(9090)로 옮겨갔고 그 포트는 publish 하지 않는다.
            #   Dockerfile 의 HEALTHCHECK 가 컨테이너 안에서 이미 그 포트를 부르고 있으므로
            #   컨테이너가 보고하는 상태를 그대로 읽는다.
            for i in $(seq 1 36); do
              status=$(docker inspect --format='{{.State.Health.Status}}' edumeet-app 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "healthy (${i}회차)"
                exit 0
              fi
              if [ "$status" = "unhealthy" ]; then
                echo "컨테이너가 unhealthy 로 확정됐다"
                break
              fi
              sleep 5
            done
            echo "헬스체크 실패 - 마지막 상태: ${status:-unknown}"
            docker compose -f docker-compose.prod.yml logs --tail=100 app
            exit 1
          envs: GHCR_TOKEN,GHCR_USER
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

      # ★ 배포할 때마다 이미지가 쌓인다. 지우는 곳이 없었다. (#173)
      #
      #   증상이 늦게 온다 - 46GB 디스크가 86% 까지 차 있었고,
      #   그중 9.2GB 가 한 번 쓰고 버린 이미지였다(96개). 배포 한 번에 약 106MB 씩
      #   늘고 있었으니 남은 여유로는 6일치였다. 디스크가 차면 MySQL 도
      #   Loki 도 Prometheus 도 같이 멈춘다.
      #
      #   최근 3개를 남긴다 - 지금 것과 되돌릴 것 둘. 지운 것도 GHCR 에 있으니
      #   더 옛것이 필요하면 pull 로 가져온다.
      #
      #   배포가 성공한 뒤에만 돈다(needs 아니라 같은 job 의 다음 step).
      #   실패한 배포에서 되돌릴 이미지를 지우면 안 된다.
      - name: 오래된 이미지 정리
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -euo pipefail
            before=$(df --output=pcent / | tail -1 | tr -dc '0-9')

            KEEP=$(docker images ghcr.io/${{ github.repository }} \
                   --format '{{.ID}} {{.CreatedAt}}' | sort -k2 -r | head -3 | cut -d' ' -f1)
            INUSE=$(docker ps -a --format '{{.Image}}' | while read -r i; do
                      docker inspect "$i" --format '{{.Id}}' 2>/dev/null || true
                    done | sed 's/sha256://' | cut -c1-12)

            DEL=$(docker images ghcr.io/${{ github.repository }} --format '{{.ID}}' | sort -u)
            for k in $KEEP $INUSE; do DEL=$(echo "$DEL" | grep -v "^$k" || true); done

            n=$(echo "$DEL" | grep -c . || true)
            if [ "$n" -gt 0 ]; then
              echo "$DEL" | grep . | xargs -r docker rmi -f >/dev/null 2>&1 || true
            fi
            docker builder prune -af >/dev/null 2>&1 || true

            after=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            echo "이미지 ${n}개 정리 · 디스크 ${before}% -> ${after}%"

            # ★ 정리하고도 여유가 없으면 배포를 실패시킨다.
            #   경보(#139)가 따로 있지만 그건 사람이 보고 움직이는 경로다.
            #   배포는 자동으로 도는데 그때 디스크가 없으면 그 배포부터 깨진다.
            if [ "$after" -ge 90 ]; then
              echo "정리 후에도 디스크가 ${after}% 다. 이미지 말고 다른 것이 차고 있다"
              df -h /
              docker system df
              exit 1
            fi

  # ★ 프론트 배포. (#99)
  #
  #   지금까지 손으로 올렸다. master 에 프론트를 고쳐 push 해도
  #   서버의 /var/www/edumeet 은 그대로였다 - "머지했는데 왜 안 바뀌지" 가 된다.
  #
  #   백엔드와 분리한 이유: 프론트는 정적 파일이라 컨테이너가 필요 없고,
  #   빌드 산출물만 nginx 아래로 옮기면 된다. 이미지를 굽지 않으니 훨씬 빠르다.
  deploy-frontend:
    name: 프론트 배포
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'      # 팀 Dockerfile 과 같은 버전
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 빌드
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.studywithtymee.com/api/v1
          VITE_BASE_URL: https://api.studywithtymee.com
          VITE_API_ORIGIN: https://api.studywithtymee.com
          VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}
        run: |
          npm ci
          npm run build
          # Vite 는 빌드 시점의 VITE_* 값을 코드에 박는다.
          # 도메인이 실제로 들어갔는지 여기서 확인한다 - 안 들어갔으면
          # 배포는 성공하는데 화면에서 API 호출만 전부 실패한다.
          grep -q "api.studywithtymee.com" dist/assets/*.js \
            || { echo "::error::빌드 산출물에 API 도메인이 없다. VITE_API_BASE_URL 확인"; exit 1; }

      # ★ 산출물은 워크스페이스 안에 둔다. (#99)
      #   scp-action 은 source 를 러너 작업 디렉터리 기준으로 찾는다.
      #   절대경로(/tmp/...)를 주면 상대경로로 해석해 "tar: empty archive" 가 난다.
      #   빌드도 압축도 성공한 채로 전송만 빈 파일이 가므로 원인이 안 보인다.
      - name: 산출물 압축
        run: tar -C frontend/dist -czf fe-dist.tgz .

      - name: 서버로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "fe-dist.tgz"
          target: "/tmp"

      - name: 원자적 교체
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          # script_stop 은 ssh-action@v1 에 없는 입력이다. 주면 조용히 무시된다.
          # (워크플로 실행 로그에 Unexpected input(s) 경고로만 남는다)
          # 중간 실패에서 멈추는 것은 스크립트 안의 set -euo pipefail 이 한다.
          script: |
            set -euo pipefail
            sudo rm -rf /var/www/edumeet.new
            sudo mkdir -p /var/www/edumeet.new
            # 빈 아카이브가 와도 그대로 배포되면 사이트가 빈 화면이 된다.
            test -s /tmp/fe-dist.tgz
            sudo tar -C /var/www/edumeet.new -xzf /tmp/fe-dist.tgz
            # 핵심 파일이 들어왔는지 교체 전에 확인한다.
            test -f /var/www/edumeet.new/index.html

            # 반쯤 복사된 상태가 서비스되지 않게 mv 로 바꾼다.
            sudo rm -rf /var/www/edumeet.old
            [ -d /var/www/edumeet ] && sudo mv /var/www/edumeet /var/www/edumeet.old
            sudo mv /var/www/edumeet.new /var/www/edumeet

            # ★ SELinux. 규칙은 등록돼 있으므로 restorecon 만 하면 된다.
            #   이게 없으면 파일 권한은 멀쩡한데 nginx 가 403 을 낸다.
            sudo restorecon -R /var/www/edumeet

            rm -f /tmp/fe-dist.tgz
            test -f /var/www/edumeet/index.html
            echo "배치 완료: $(sudo find /var/www/edumeet -type f | wc -l) 파일"

      - name: 실제로 뜨는지 확인
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://studywithtymee.com/ || echo 000)
            [ "$CODE" = "200" ] && { echo "확인: 200"; exit 0; }
            echo "  ${i}회차: $CODE"; sleep 6
          done
          echo "::error::배포 후 사이트가 200 을 주지 않는다"
          exit 1

  # AI 서비스 이미지. (#110)
  #
  # ★ 수동 트리거로만 돈다. 자동 배포하지 않는 이유 -
  #     /STT/{class_id} 를 부르는 곳이 저장소 어디에도 없고,
  #     파이썬이 자막을 백엔드로 보내는 코드도 없다.
  #   돌지 않는 서비스를 자동 배포하면 "만들었는데 동작 안 함" 이 하나 더 는다.
  #
  #   켤 준비가 되면 이 잡의 if 를 지우고 compose 의 --profile ai 를 붙인다.
  build-ai-image:
    name: AI 이미지 빌드
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_ai
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./ai
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
