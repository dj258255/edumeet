name: CI

# PR 과 master push 에서 빌드·테스트를 돌린다.
# 배포는 deploy.yml 이 담당한다. 둘을 나눈 이유는 CI 는 빠르게 돌아야 하고
# 배포는 이미지 빌드까지 하느라 느리기 때문이다.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다. 러너 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # ARM 러너를 쓴다. 배포 대상(OCI A1.Flex)이 aarch64 라 같은 아키텍처에서 테스트한다.
    # public 저장소는 ARM 러너가 무료다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test --no-daemon
        working-directory: backend

      - name: Test
        run: ./gradlew test --no-daemon
        working-directory: backend

      # 실패해도 리포트는 남긴다. 어떤 테스트가 깨졌는지 봐야 하기 때문.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: backend/build/test-results/test/*.xml
          check_name: 테스트 결과
          detailed_summary: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/test/
          retention-days: 7

  # ★ AI 서비스도 CI 에 넣는다. (#91)
  #   계약 파일(contracts/internal-api.json)을 Java 와 파이썬이 함께 읽으므로
  #   한쪽만 돌리면 갈라진 것을 못 잡는다. 실제로 그래서 오래 안 잡혔다.
  ai-tests:
    name: AI 서비스 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          # ai/main.py 는 str | None (PEP 604) 을 쓴다. 3.9 에서는 import 조차 안 된다.
          python-version-file: ai/.python-version

      - name: 의존성 설치
        working-directory: ai
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          pip install -q pytest pytest-asyncio responses httpx

      - name: 테스트
        working-directory: ai
        run: pytest -q
