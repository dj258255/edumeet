name: CI

# PR 과 master push 에서 빌드·테스트를 돌린다.
# 배포는 deploy.yml 이 담당한다. 둘을 나눈 이유는 CI 는 빠르게 돌아야 하고
# 배포는 이미지 빌드까지 하느라 느리기 때문이다.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다. 러너 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ★ 무엇이 바뀌었는지 먼저 본다. (#99)
  #
  #   모노레포다. 문서만 고쳐도 백엔드 전체를 빌드·테스트하는 것은 낭비다.
  #   반대로 경로 필터를 워크플로의 on: 에 걸면 "돌지 않은 잡" 이 pending 으로
  #   남아 필수 체크가 영원히 안 끝난다. 그래서 잡 단위로 나눈다 -
  #   해당 없는 잡은 skip 되고 체크는 초록으로 끝난다.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai: ${{ steps.filter.outputs.ai }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            ai:
              - 'ai/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            # mcp 는 ai/ 에도 걸린다. 용어 사전(ai/caption_normalizer.py)을
            # 그대로 import 하므로, 사전이 바뀌면 검색 결과가 바뀐다. (#133)
            mcp:
              - 'mcp-server/**'
              - 'contracts/**'
              - 'ai/caption_normalizer.py'
              - '.github/workflows/ci.yml'

  # ★ 문서가 가리키는 재현 파일이 저장소에 있는지 본다. (#162)
  #
  #   두 번 빠졌다. #156 squash 에서 k6 스크립트가 통째로 빠졌고,
  #   .gitignore 의 *.sh 가 scripts/ 의 재현 스크립트 6개를 먹고 있었다.
  #   둘 다 로컬에는 파일이 있어서 아무도 눈치채지 못했다.
  #   재현 경로가 저장소에 없으면 그 측정은 다시 못 돌린다.
  #
  #   경로 필터를 안 건다. 이 검사는 30초짜리이고, 무엇을 고쳐도
  #   문서와 파일의 짝이 깨질 수 있다.
  doc-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: 문서가 가리키는 파일 존재
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-doc-refs.sh

  build-and-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: 백엔드 테스트
    # ARM 러너를 쓴다. 배포 대상(OCI A1.Flex)이 aarch64 라 같은 아키텍처에서 테스트한다.
    # public 저장소는 ARM 러너가 무료다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test --no-daemon
        working-directory: backend

      - name: Test
        run: ./gradlew test --no-daemon
        working-directory: backend

      # 실패해도 리포트는 남긴다. 어떤 테스트가 깨졌는지 봐야 하기 때문.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: backend/build/test-results/test/*.xml
          check_name: 테스트 결과
          detailed_summary: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/test/
          retention-days: 7

  # ★ AI 서비스도 CI 에 넣는다. (#91)
  #   계약 파일(contracts/internal-api.json)을 Java 와 파이썬이 함께 읽으므로
  #   한쪽만 돌리면 갈라진 것을 못 잡는다. 실제로 그래서 오래 안 잡혔다.
  ai-tests:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    name: AI 서비스 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          # ai/main.py 는 str | None (PEP 604) 을 쓴다. 3.9 에서는 import 조차 안 된다.
          python-version-file: ai/.python-version

      - name: 의존성 설치
        working-directory: ai
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          pip install -q pytest pytest-asyncio responses httpx

      - name: 테스트
        working-directory: ai
        run: pytest -q

  # 계약의 세 번째 소비자다. (#133)
  #
  #   backend  노출한 경로가 계약과 같은가
  #   ai       부르는 경로가 계약과 같은가
  #   mcp      도구가 부르는 경로가 계약과 같은가
  #
  #   셋이 같은 contracts/internal-api.json 을 읽으므로, 계약이 바뀌면 셋 다 돈다.
  mcp-tests:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    name: MCP 서버 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version-file: mcp-server/.python-version

      - name: 의존성 설치
        working-directory: mcp-server
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt

      # 저장소 체크아웃 위에서 돈다 - ai/caption_normalizer.py 를 import 하므로
      # mcp-server/ 만 체크아웃해서는 시험이 반쪽이 된다.
      - name: 테스트
        working-directory: mcp-server
        run: pytest -q

  # ★ 프론트도 CI 에 넣는다. (#99)
  #   지금까지 프론트는 빌드조차 검증되지 않았다. 깨진 채로 머지돼도 알 수 없었고,
  #   실제로 배포할 때가 되어서야 알게 된다. 그때가 제일 나쁘다.
  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: 프론트 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 팀 Dockerfile 과 같은 버전. 다른 버전에서는 vite-plugin-vue-devtools 가
          # 설정 로드 시점에 죽는다(Node 25 의 localStorage 는 객체인데 getItem 이 없다).
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 테스트
        working-directory: frontend
        run: npm test

      - name: 빌드
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.studywithtymee.com/api/v1
          VITE_BASE_URL: https://api.studywithtymee.com
          VITE_API_ORIGIN: https://api.studywithtymee.com
          VITE_LIVEKIT_URL: ${{ vars.VITE_LIVEKIT_URL }}
        run: npm run build

      - name: 산출물에 죽은 주소가 남았는지
        working-directory: frontend
        run: |
          # i13c205 는 없어진 SSAFY 서버다. 새로 들어오면 막는다.
          # DocumentSummaryView 의 2곳은 우리 백엔드에 없는 경로라 의도적으로 남겼다.
          COUNT=$(grep -roh "i13c205" dist/ 2>/dev/null | wc -l)
          echo "죽은 주소 등장: $COUNT 회 (허용 상한 20)"
          if [ "$COUNT" -gt 20 ]; then
            echo "::error::없어진 SSAFY 서버 주소가 늘었다. 새 하드코딩을 확인할 것."
            exit 1
          fi
