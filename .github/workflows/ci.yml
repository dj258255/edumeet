name: CI

# PR 과 master push 에서 빌드·테스트를 돌린다.
# 배포는 deploy.yml 이 담당한다. 둘을 나눈 이유는 CI 는 빠르게 돌아야 하고
# 배포는 이미지 빌드까지 하느라 느리기 때문이다.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다. 러너 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # ARM 러너를 쓴다. 배포 대상(OCI A1.Flex)이 aarch64 라 같은 아키텍처에서 테스트한다.
    # public 저장소는 ARM 러너가 무료다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      # 실패해도 리포트는 남긴다. 어떤 테스트가 깨졌는지 봐야 하기 때문.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: build/test-results/test/*.xml
          check_name: 테스트 결과
          detailed_summary: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7
