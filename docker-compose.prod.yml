# 운영 배포용. OCI VM.Standard.A1.Flex (aarch64) 에서 돌린다.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# 필요한 환경변수는 .env 에 둔다. (저장소에 커밋하지 않는다)

x-app-common: &app-common
  # ★ 기본값을 두지 않는다. (#83)
  #   :latest 로 두면 APP_IMAGE export 를 잊은 채 compose up 을 했을 때
  #   운영이 핀 태그에서 떠다니는 태그로 조용히 바뀐다. 경고도 없다.
  image: ${APP_IMAGE:?APP_IMAGE 를 지정해야 한다. 기본값을 :latest 로 두면 export 를 잊었을 때 운영이 조용히 떠다니는 태그로 바뀐다}
  env_file: .env
  restart: unless-stopped
  volumes:
    - app_logs:/app/logs
    - app_upload:/app/upload
    - /var/lib/edumeet/hls:/var/lib/edumeet/hls
  environment:
    # nginx 가 같은 호스트 경로를 /hls/ 로 서빙한다. (#123)
    # 기본값(/tmp/edumeet-hls)을 그대로 두면 앱은 만들지만 사용자는 못 받는다.
    EDUMEET_BROADCAST_OUTPUT_DIR: /var/lib/edumeet/hls
    EDUMEET_BROADCAST_PUBLIC_BASE_URL: /hls
  # ★ healthcheck 를 기다린다.
  #   그냥 depends_on 만 쓰면 MySQL 프로세스가 뜬 순간 앱이 시작해서
  #   커넥션 실패로 죽는다. condition: service_healthy 가 있어야 한다.
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    edumeet:
      # 파이썬 서비스가 http://app:8080 으로 부른다. 슬롯 이름을 모르게 둔다.
      aliases: [app]

services:
  mysql:
    image: mysql:8.0
    container_name: edumeet-mysql
    env_file: .env
    restart: unless-stopped
    # ★ 호스트 포트로 노출하지 않는다.
    #   공인 IP 서버에서 3306 을 열면 인터넷 전체에 DB 가 노출된다.
    #   같은 compose 네트워크 안에서는 서비스명(mysql)으로 접근되므로 포트 공개가 불필요하다.
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [edumeet]

  redis:
    image: redis:7-alpine
    container_name: edumeet-redis
    restart: unless-stopped
    expose:
      - "6379"          # 마찬가지로 외부 노출 금지
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [edumeet]

  # ── 앱은 슬롯 두 개다 (blue / green). (#180) ────────────────────
  #
  # ★ 왜 두 개인가 - 배포할 때마다 서비스가 20.5초 끊겼다(실측, #173).
  #   컨테이너를 지우고 다시 만드는 방식이라 그 사이에 아무것도 없다.
  #
  #   한 슬롯이 서비스하는 동안 다른 슬롯에 새 이미지를 띄우고,
  #   그쪽이 건강해진 것을 확인한 뒤에 nginx 를 옮긴다.
  #   그러고 나서 옛 슬롯을 내린다.  (scripts/deploy-app.sh)
  #
  # ★ 덤으로 얻는 것이 더 중요할 수 있다 - 새 이미지가 안 뜨면
  #   nginx 를 안 옮기고 그냥 그만둔다. **옛 슬롯은 내려간 적이 없다.**
  #   지금 방식은 새 것이 뜨는지 알기 전에 옛 것을 이미 지운다.
  #
  # ★ 프로필로 가둔다. 프로필 없이 `up -d` 하면 둘 다 안 뜬다 -
  #   앱 슬롯은 배포 스크립트만 건드리게 하려는 것이다.
  #   둘이 동시에 오래 떠 있으면 채팅 중개자가 메모리에 있어 방이 갈린다.
  app-blue:
    <<: *app-common
    container_name: edumeet-app-blue
    profiles: [blue]
    # ★ 127.0.0.1 에만 묶는다. nginx 가 같은 호스트에서 붙는다.
    #   전에는 8080 이 0.0.0.0 이라 보안 목록만 믿고 있었다.
    # ★ 관리 포트가 9091 이 아니다.
    #   blue/green 이전의 단일 컨테이너가 9091 을 쥐고 있어서, 첫 전환 때
    #   그 컨테이너가 아직 살아 있는 채로 blue 를 띄우면 포트가 겹친다.
    #   실제로 첫 배포가 거기서 실패했다 - "port is already allocated".
    #   무중단이려면 옛 것이 살아 있는 동안 새 것이 떠야 하므로,
    #   겹칠 수 있는 포트는 애초에 피한다.
    ports:
      - "127.0.0.1:8081:8080"
      - "${MANAGEMENT_BIND:-127.0.0.1}:9092:9090"

  app-green:
    <<: *app-common
    container_name: edumeet-app-green
    profiles: [green]
    ports:
      - "127.0.0.1:8082:8080"
      - "${MANAGEMENT_BIND:-127.0.0.1}:9093:9090"

  # ★ 서버에 이미 다른 프로젝트(balruno)의 Prometheus/Grafana 가 돌고 있다.
  #   2 vCPU 서버에 Prometheus 를 두 벌 띄우는 것은 낭비다.
  #   기본으로는 뜨지 않고, 독립 스택이 필요할 때만 --profile observability 로 띄운다.
  #
  #     docker compose -f docker-compose.prod.yml --profile observability up -d
  #
  #   기존 스택을 재사용하는 방법은 docs/ops/04-observability.md 를 본다.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: edumeet-prometheus
    profiles: [observability]
    restart: unless-stopped
    # 마찬가지로 외부 노출 금지. Grafana 가 네트워크 안에서 붙는다.
    expose:
      - "9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 경보 규칙. (#139) 규칙만 고치고 재시작하려면 별도 마운트여야 한다.
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 개인 서버라 디스크가 넉넉하지 않다. 15일이면 회귀 분석에 충분하다.
      - --storage.tsdb.retention.time=15d
      # 규칙을 고쳤을 때 컨테이너를 죽이지 않고 다시 읽게 한다. (#139)
      # 내부망에서만 닿으므로(expose 만 함) 바깥에서 리로드를 부를 수 없다.
      - --web.enable-lifecycle
    # ★ depends_on 을 안 건다. (#180)
    #   앱은 슬롯 두 개(app-blue / app-green)이고 프로필로 가려져 있어
    #   여기서 이름으로 가리킬 수 없다. Prometheus 는 앱이 없어도 떠야 한다 -
    #   앱이 죽은 것을 알려 주는 것이 이쪽 일이다.
    networks: [edumeet]

  # 경보를 받아 사람에게 보내는 쪽. (#139)
  #
  # ★ 이것이 없으면 규칙은 firing 이 되지만 아무 데도 안 간다.
  #   Prometheus 는 경보를 "평가" 하고, 보내는 것은 Alertmanager 다.
  #   규칙 파일만 두고 끝내면 대시보드 안에서만 빨개진다 -
  #   그건 지금까지와 똑같이 "사람이 열어야 보이는" 상태다.
  #
  # 127.0.0.1 에만 묶는 이유는 Grafana 와 같다(#89). Alertmanager UI 는
  # 인증이 없어서 열려 있으면 누구나 경보를 침묵시킬 수 있다.
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: edumeet-alertmanager
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks: [edumeet]

  # 로그 저장소. (#166)
  #
  # ★ 왜 필요한가 - 경보가 울린 뒤에 볼 것이 없었다.
  #   경보 문서에 "급성 구간에서는 사후 기록으로 읽는다" 고 적어 뒀는데,
  #   그 기록을 보려면 서버에 들어가 docker logs 를 쳐야 했다.
  #   컨테이너를 다시 만들면 그 기록도 사라진다.
  #
  # 외부 노출 안 한다. Grafana 가 네트워크 안에서 붙는다.
  loki:
    image: grafana/loki:3.3.2
    container_name: edumeet-loki
    profiles: [observability]
    restart: unless-stopped
    user: "10001:10001"
    expose:
      - "3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki.yml
    networks: [edumeet]

  # 컨테이너 로그를 모아 Loki 로 보낸다. (#166)
  #
  # ★ 도커 소켓을 읽기 전용으로 준다.
  #   소켓이 있으면 컨테이너를 만들고 지울 수 있다. :ro 가 그것을 막지는 못하지만
  #   (도커 API 는 GET 이 아니어도 소켓만 있으면 된다) 의도를 남긴다.
  #   더 줄이려면 소켓 프록시를 앞에 둬야 하는데, 컨테이너를 하나 더 띄우는
  #   비용 대비 이득이 이 서버에서는 아직 없다.
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: edumeet-alloy
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on: [loki]
    networks: [edumeet]

  # 호스트 자원(디스크·CPU·메모리). (#173)
  #
  # ★ 왜 필요해졌나 - 디스크가 86% 까지 찼는데 경보가 없었다.
  #   배포할 때마다 이미지가 945MB 씩 쌓이고 지우는 곳이 없었다(96개 중 9.2GB 가
  #   한 번 쓰고 버린 것). 디스크가 차면 앱만 죽는 게 아니라 MySQL·Loki·Prometheus 가
  #   같이 멈춘다. 그런데 우리가 긁는 것은 앱의 관리 포트뿐이라
  #   호스트 디스크는 물어볼 지표조차 없었다.
  #
  # ★ 왜 Alloy 로 안 하나 - Alloy 에도 같은 수집기가 들어 있다(prometheus.exporter.unix).
  #   다만 Alloy 의 수집기는 스크레이프가 아니라 remote_write 로 내보내는 구조라
  #   Prometheus 쪽에 수신기를 열어야 한다. 12MB 짜리 컨테이너 하나를
  #   지금까지와 똑같이 긁는 편이 움직이는 부품이 적다.
  #
  # 읽기 전용 마운트만 준다. 호스트 파일시스템을 rootfs 로 보고 크기만 읽는다.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: edumeet-node-exporter
    profiles: [observability]
    restart: unless-stopped
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # 백업 스크립트가 여기에 지표 파일을 쓴다. (#175)
      # 컨테이너가 아닌 것(systemd 타이머)의 상태를 Prometheus 로 올리는 표준 통로다.
      - /var/lib/edumeet/node-exporter-textfile:/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/textfile
      # 컨테이너·오버레이 마운트까지 세면 같은 디스크가 수십 번 잡힌다.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    networks: [edumeet]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: edumeet-grafana
    profiles: [observability]
    restart: unless-stopped
    # ★ 127.0.0.1 에만 묶는다. (#89)
    #
    #   이 파일은 노출에 일관되게 조심하고 있는데 여기만 예외였다.
    #     mysql · redis · prometheus   expose 만 (내부망)
    #     actuator                     10.0.0.11:9091 (사설 IP 전용)
    #     grafana                      0.0.0.0:3001    <- 여기
    #
    #   지금은 OCI 보안 목록이 막아 준다. 그런데 80/443 을 열려고
    #   그 목록을 편집해야 하는 시점이라, 3001 이 딸려 열리면
    #   Grafana 로그인 화면이 그대로 인터넷에 뜬다.
    #   보안 목록이 잘못돼도 바인딩이 막게 한 겹 더 둔다.
    #
    #   보는 방법:  ssh -L 3001:localhost:3001 rocky@<host>
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD 를 .env 에 설정해야 한다}
      # 익명 접근을 막는다. 지표는 내부 정보다.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # 대시보드를 UI 로 만들면 재현이 안 된다. 파일로 넣고 저장소에 커밋한다.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki]
    networks: [edumeet]


  # AI 서비스 (STT · 요약 · PDF). (#110)
  #
  # ★ profiles 로 기본 비활성이다. 지금 켜면 안 되는 이유 -
  #     /STT/{class_id} 를 부르는 곳이 저장소 어디에도 없고,
  #     파이썬이 자막을 백엔드로 보내는 코드도 없다.
  #   배포해도 아무도 안 부르고, 부를 수 있어도 자막이 안 나간다.
  #
  #   켜려면:  docker compose --profile ai up -d
  #   그 전에 트리거 경로와 자막 전송을 먼저 만든다.
  ai:
    # ★ :? 를 쓰지 않는다. (#110)
    #
    #   Compose 는 프로필이 꺼진 서비스라도 변수 보간을 먼저 한다 -
    #   프로필 필터링은 그 다음 단계다. :? 를 쓰면 ai 를 켜지 않는
    #   평범한 배포까지 "required variable AI_IMAGE is missing" 으로 죽는다.
    #   실제로 그렇게 배포가 한 번 실패했다.
    #
    #   대신 :- 로 자리표시자를 준다. --profile ai 로 켤 때
    #   AI_IMAGE 를 안 주면 그 태그를 못 찾아 pull 에서 실패하므로
    #   "조용히 엉뚱한 것이 뜨는" 일은 없다.
    image: ${AI_IMAGE:-ghcr.io/dj258255/edumeet-ai:set-AI_IMAGE-to-deploy}
    container_name: edumeet-ai
    profiles: [ai]
    restart: unless-stopped
    # 외부에 열지 않는다. 백엔드가 compose 네트워크 안에서 부른다.
    expose:
      - "8000"
    environment:
      # 계약은 contracts/internal-api.json 이다. 경로 변수는 meetingId 다.
      SUMMARY_UPLOAD_URL: http://app:8080/api/v1/internal/meetings/{meetingId}/summary
      CAPTION_INGEST_URL: http://app:8080/api/v1/internal/meetings/{meetingId}/captions
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOVA_INVOKE_URL: ${CLOVA_INVOKE_URL:-}
      CLOVA_SECRET_KEY: ${CLOVA_SECRET_KEY:-}
    # ★ depends_on 을 안 건다. (#180)
    #   앱은 슬롯 두 개이고 프로필로 가려져 있어 이름으로 가리킬 수 없다.
    #   http://app:8080 은 네트워크 별칭으로 닿는다.
    networks:
      - edumeet

  # ── 화상강의용 WebRTC SFU ──────────────────────────────────────────
  #
  # 프로필로 가둔다. 켜 놓고 안 쓰면 2코어에서 CPU 여유를 그냥 갉아먹는다.
  #
  #   docker compose -f docker-compose.prod.yml --profile livekit up -d
  #
  # ★ egress 는 없다. 방송(HLS)은 우리가 직접 만든다. (#123)
  #   RoomComposite 의 CPU 4 는 "여러 참가자 화면을 합성" 하는 비용인데
  #   방송은 발표자 한 명만 나가므로 합성할 것이 없다.
  #   여기 LiveKit 은 화상강의(INTERACTIVE)의 WebRTC SFU 로만 쓴다.
  #   근거: docs/plan/05-own-hls.md
  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: edumeet-livekit
    profiles: [livekit]
    restart: unless-stopped
    # 시크릿을 설정 파일에 두지 않는다. 앱이 쓰는 값과 같아야 한다.
    environment:
      # ★ :? 를 쓰지 않는다. (#187)
      #
      #   Compose 는 프로필이 꺼진 서비스라도 **변수 보간을 먼저 한다** -
      #   프로필 필터링은 그 다음 단계다. 그래서 :? 를 쓰면 livekit 을 켜지 않는
      #   평범한 배포까지 "required variable LIVEKIT_API_KEY is missing" 으로 죽는다.
      #
      #   이 저장소는 같은 함정을 ai 서비스의 AI_IMAGE 에서 이미 한 번 만났다(#110).
      #   거기만 고치고 여기를 안 고쳐서, 값이 비는 순간 배포 전체가 멈췄다.
      #   **한 번 만난 함정은 같은 모양을 전부 찾아야 한다.**
      #
      #   :- 로 자리표시자를 준다. --profile livekit 으로 켤 때 값을 안 주면
      #   LiveKit 이 그 키로 토큰 검증에 실패하므로 조용히 엉뚱하게 뜨지는 않는다.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-set-LIVEKIT_API_KEY-to-run}: ${LIVEKIT_API_SECRET:-set-LIVEKIT_API_SECRET-to-run}"
      # ★ ICE 포트 범위를 반드시 좁혀서 도커 매핑과 맞춘다.
      #   기본값은 50000~60000 이다. 도커에 그 범위를 통째로 매핑하면 포트당 규칙을
      #   만드느라 기동이 몇 분씩 걸리고, 좁게 매핑만 하고 여기를 안 고치면
      #   LiveKit 이 매핑 밖 포트를 골라 연결이 조용히 실패한다.
      # ★ 이름이 LIVEKIT_CONFIG 다. LIVEKIT_CONFIG_BODY 로 주면
      #   경고 하나 없이 전부 기본값으로 뜬다. (--config-body 의 EnvVar 가 LIVEKIT_CONFIG)
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50019
          use_external_ip: false
        redis:
          address: redis:6379
        logging:
          level: info
    command: --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      # 밖으로 열지 않는다. 측정도 앱 호출도 전부 이 호스트 안에서 한다.
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:50000-50019:50000-50019/udp"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edumeet

volumes:
  loki_data:
  alloy_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  mysql_data:
  redis_data:
  app_logs:
  app_upload:

networks:
  edumeet:
    driver: bridge
