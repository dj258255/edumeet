# 운영 배포용. OCI VM.Standard.A1.Flex (aarch64) 에서 돌린다.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# 필요한 환경변수는 .env 에 둔다. (저장소에 커밋하지 않는다)

services:
  mysql:
    image: mysql:8.0
    container_name: edumeet-mysql
    env_file: .env
    restart: unless-stopped
    # ★ 호스트 포트로 노출하지 않는다.
    #   공인 IP 서버에서 3306 을 열면 인터넷 전체에 DB 가 노출된다.
    #   같은 compose 네트워크 안에서는 서비스명(mysql)으로 접근되므로 포트 공개가 불필요하다.
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [edumeet]

  redis:
    image: redis:7-alpine
    container_name: edumeet-redis
    restart: unless-stopped
    expose:
      - "6379"          # 마찬가지로 외부 노출 금지
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [edumeet]

  app:
    image: ${APP_IMAGE:-ghcr.io/dj258255/edumeet:latest}
    container_name: edumeet-app
    env_file: .env
    restart: unless-stopped
    # ★ 관리 포트(9090)는 공인 IP 에 열지 않는다.
    #   지표는 URI 패턴·호출량·커넥션 수 같은 내부 정보를 담는다.
    #
    #   다만 기존 관측 스택(balruno-monitoring)이 별도 compose 네트워크에 있어
    #   서비스명으로는 닿지 못한다. 그래서 사설 IP 에만 바인딩해 노출한다.
    #   독립 스택(--profile observability)만 쓸 거면 127.0.0.1 로 두면 된다.
    ports:
      - "8080:8080"
      - "${MANAGEMENT_BIND:-127.0.0.1}:9091:9090"
    volumes:
      - app_logs:/app/logs
      - app_upload:/app/upload
    # ★ healthcheck 를 기다린다.
    #   그냥 depends_on 만 쓰면 MySQL 프로세스가 뜬 순간 앱이 시작해서
    #   커넥션 실패로 죽는다. condition: service_healthy 가 있어야 한다.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edumeet]

  # ★ 서버에 이미 다른 프로젝트(balruno)의 Prometheus/Grafana 가 돌고 있다.
  #   2 vCPU 서버에 Prometheus 를 두 벌 띄우는 것은 낭비다.
  #   기본으로는 뜨지 않고, 독립 스택이 필요할 때만 --profile observability 로 띄운다.
  #
  #     docker compose -f docker-compose.prod.yml --profile observability up -d
  #
  #   기존 스택을 재사용하는 방법은 docs/ops/04-observability.md 를 본다.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: edumeet-prometheus
    profiles: [observability]
    restart: unless-stopped
    # 마찬가지로 외부 노출 금지. Grafana 가 네트워크 안에서 붙는다.
    expose:
      - "9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 개인 서버라 디스크가 넉넉하지 않다. 15일이면 회귀 분석에 충분하다.
      - --storage.tsdb.retention.time=15d
    depends_on: [app]
    networks: [edumeet]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: edumeet-grafana
    profiles: [observability]
    restart: unless-stopped
    # 사람이 봐야 하므로 이것만 publish 한다. 비밀번호는 .env 로 준다.
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD 를 .env 에 설정해야 한다}
      # 익명 접근을 막는다. 지표는 내부 정보다.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # 대시보드를 UI 로 만들면 재현이 안 된다. 파일로 넣고 저장소에 커밋한다.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [edumeet]

volumes:
  prometheus_data:
  grafana_data:
  mysql_data:
  redis_data:
  app_logs:
  app_upload:

networks:
  edumeet:
    driver: bridge
