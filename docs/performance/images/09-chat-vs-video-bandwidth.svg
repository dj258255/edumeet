<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="880" height="336" fill="#ffffff"/>
<text x="28" y="32" font-size="18" font-weight="700" fill="#111827">채팅과 영상의 대역폭 차이</text>
<text x="28" y="53" font-size="12.5" fill="#6b7280">메시지 200B 기준 · 채팅은 계산값, 영상은 실측 기반 도출</text>
<text x="218" y="93" text-anchor="end" font-size="13" font-weight="600" fill="#111827">화상강의 30명 · 영상</text>
<text x="218" y="108" text-anchor="end" font-size="11" fill="#6b7280">18.7 GB/h</text>
<rect x="232" y="78" width="552" height="26" rx="4" fill="#f3f4f6"/>
<rect x="232" y="78" width="4.7" height="26" rx="4" fill="#dc2626"/>
<text x="246.7" y="97" font-size="13.5" font-weight="700" fill="#dc2626">18.7 GB/h</text>
<text x="218" y="139" text-anchor="end" font-size="13" font-weight="600" fill="#111827">화상강의 30명 · 채팅</text>
<text x="218" y="154" text-anchor="end" font-size="11" fill="#6b7280">0.10 GB/h (0.5%)</text>
<rect x="232" y="124" width="552" height="26" rx="4" fill="#f3f4f6"/>
<rect x="232" y="124" width="2.0" height="26" rx="4" fill="#2563eb"/>
<text x="244.0" y="143" font-size="13.5" font-weight="700" fill="#2563eb">0.1 GB/h</text>
<text x="218" y="185" text-anchor="end" font-size="13" font-weight="600" fill="#111827">라이브방송 3,000명 · 영상</text>
<text x="218" y="200" text-anchor="end" font-size="11" fill="#6b7280">1866.8 GB/h</text>
<rect x="232" y="170" width="552" height="26" rx="4" fill="#f3f4f6"/>
<rect x="232" y="170" width="468.4" height="26" rx="4" fill="#dc2626"/>
<text x="710.4" y="189" font-size="13.5" font-weight="700" fill="#dc2626">1866.8 GB/h</text>
<text x="218" y="231" text-anchor="end" font-size="13" font-weight="600" fill="#111827">라이브방송 3,000명 · 채팅</text>
<text x="218" y="246" text-anchor="end" font-size="11" fill="#6b7280">40.23 GB/h (2.2%)</text>
<rect x="232" y="216" width="552" height="26" rx="4" fill="#f3f4f6"/>
<rect x="232" y="216" width="10.1" height="26" rx="4" fill="#2563eb"/>
<text x="252.1" y="235" font-size="13.5" font-weight="700" fill="#2563eb">40.2 GB/h</text>
<text x="28" y="312" font-size="11.5" fill="#6b7280">채팅은 영상의 0.5~2.2% 다. 이게 '채팅 서버는 되는데 영상 서버는 안 되는' 이유다.</text>
</svg>