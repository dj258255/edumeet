# Ansible 설정. 이 디렉터리에서 ansible-playbook 을 돌리면 자동으로 읽힌다.
[defaults]
inventory = inventory.yml
host_key_checking = False
# vault 비밀번호는 저장소에 없다. .vault-pass 는 gitignore 대상이다.
vault_password_file = .vault-pass
# 결과를 읽기 좋게. ansible-core 2.13+ 부터는 콜백 플러그인이 아니라 이 옵션이다.
# community.general.yaml 콜백은 12.0.0 에서 제거됐다.
result_format = yaml
[ssh_connection]
pipelining = True
